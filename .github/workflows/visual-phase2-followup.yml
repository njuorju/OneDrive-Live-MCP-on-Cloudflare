name: Visual Phase 2 follow-up patch

on:
  push:
    branches:
      - work/onedrivelive-visual-asset-phase2

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[phase2-followup]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/onedrivelive-visual-asset-phase2
          fetch-depth: 0
      - name: Apply bounded source corrections
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/visual-phase2.ts')
          text = path.read_text()
          changes = [
              ('format: "jpeg", mimeType: "image/jpeg", width:', 'format: "jpeg" as const, mimeType: "image/jpeg" as const, width:'),
              ('String(context.env.WORKER_DEPLOYMENT_ID ?? context.env.WORKER_VERSION ?? "unknown")', 'String((context.env as any).WORKER_DEPLOYMENT_ID ?? (context.env as any).WORKER_VERSION ?? "unknown")'),
              ('Number(context.env.INTEGRITY_LEASE_SECONDS ?? DEFAULT_INTEGRITY_LEASE_SECONDS)', 'Number((context.env as any).INTEGRITY_LEASE_SECONDS ?? DEFAULT_INTEGRITY_LEASE_SECONDS)'),
              ('action: "METADATA_ONLY", destinationPath, proposedFilename,', 'action: "CREATE_PREPARED_BINARY", destinationPath, proposedFilename,'),
              ('action: "METADATA_ONLY", sourcePath: targetPath,', 'action: actionType, sourcePath: targetPath, destinationPath: targetPath,'),
          ]
          for old, new in changes:
              if old not in text:
                  raise SystemExit(f'expected source fragment absent: {old}')
              text = text.replace(old, new)
          path.write_text(text)
          PY
      - name: Commit correction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/visual-phase2.ts
          git diff --cached --quiet && exit 0
          git commit -m "Tighten visual Phase 2 action semantics [phase2-followup]"
          git push origin HEAD:work/onedrivelive-visual-asset-phase2
