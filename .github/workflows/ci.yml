name: CI

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  apply-export-fix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ github.token }}
      - name: Apply exact asserted re-export fix
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          python - <<'PY'
          from pathlib import Path
          path = Path('src/file-backed-text.ts')
          text = path.read_text()
          old = '''export {
  connectorFileInputSchema,
  connectorFileRuntimeShape,
  loadConnectorTextFile,
  normalizeConnectorFileReference,
  trustedConnectorFileUrl,
} from "./connector-files";
'''
          new = '''export {
  CHATGPT_ATTACHMENT_HOST,
  connectorFileInputSchema,
  connectorFileRuntimeShape,
  isPublicRoutableAddress,
  loadConnectorTextFile,
  normalizeConnectorFileReference,
  trustedConnectorFileUrl,
} from "./connector-files";
'''
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one export block, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
          git add src/file-backed-text.ts
          git diff --cached --check
          test "$(git diff --cached --name-only)" = "src/file-backed-text.ts"
      - name: Commit focused re-export fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "ODL-REQ-025: re-export connector policy helpers"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
