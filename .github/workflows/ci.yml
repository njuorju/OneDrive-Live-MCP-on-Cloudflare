name: CI

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  apply-type-fix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ github.token }}
      - name: Verify and apply exact type fix
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          echo "0b98d6ed10541628401a72945c3bf722742d4519adf105db370278dfe17fe4fe  .odl-req-025-type-fix.patch" | sha256sum --check
          git apply --check .odl-req-025-type-fix.patch
          git apply .odl-req-025-type-fix.patch
          rm .odl-req-025-type-fix.patch
          git add src/visual-catalogue-opencode.ts .odl-req-025-type-fix.patch
          git diff --cached --check
      - name: Commit focused type fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "ODL-REQ-025: fix Responses endpoint-family type"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
