name: CI

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  apply-usage-fix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ github.token }}
      - name: Verify and apply exact usage fix
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          echo "f309fe77519db2527e9e729ef89661bd89821b6d5dd76295900e261d61ec4b80  .odl-req-025-usage-fix.patch" | sha256sum --check
          git apply --check .odl-req-025-usage-fix.patch
          git apply .odl-req-025-usage-fix.patch
          rm .odl-req-025-usage-fix.patch
          git add src/visual-catalogue-zen-responses.ts .odl-req-025-usage-fix.patch
          git diff --cached --check
      - name: Commit focused usage fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "ODL-REQ-025: preserve missing usage accounting"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
