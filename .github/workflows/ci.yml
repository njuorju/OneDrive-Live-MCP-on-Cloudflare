name: CI

on:
  push:
    branches:
      - main
      - work/**
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  correct-odl-req-027:
    if: github.event_name == 'pull_request' && github.head_ref == 'feature/odl-req-027-regional-attachments-zen-post'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/odl-req-027-regional-attachments-zen-post
          fetch-depth: 0
      - name: Apply exact PR-local corrections and restore CI
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          source_path = Path('src/visual-catalogue-zen-responses.ts')
          source = source_path.read_text(encoding='utf-8')
          source = replace_once(
              source,
              '''  if (typeof (input.fetchImpl ?? fetch) !== "function") {
    return failZenResponsesTransport(input.env, receiptKey, receipt, "zen_responses_fetch_not_started", "The Zen Responses fetch implementation was not invokable.", "fetch_invocation");
  }''',
              '''  const fetchImplCandidate = input.fetchImpl === undefined ? fetch : input.fetchImpl;
  if (typeof fetchImplCandidate !== "function") {
    return failZenResponsesTransport(input.env, receiptKey, receipt, "zen_responses_fetch_not_started", "The Zen Responses fetch implementation was not invokable.", "fetch_invocation");
  }''',
              'explicit fetch implementation validation',
          )
          source = replace_once(
              source,
              '  const fetchImpl = input.fetchImpl ?? fetch;',
              '  const fetchImpl = fetchImplCandidate;',
              'validated fetch implementation selection',
          )
          source_path.write_text(source, encoding='utf-8')

          test_path = Path('test/connector-file-contract.test.ts')
          tests = test_path.read_text(encoding='utf-8')
          tests = replace_once(
              tests,
              '''  for (const value of forbidden) {
    assert.throws(() => trustedConnectorFileUrl(value), (error: unknown) => error instanceof ConnectorError && error.code === "connector_file_download_forbidden");
  }
});

test("regional host acceptance never substitutes''',
              '''  for (const value of forbidden) {
    assert.throws(
      () => trustedConnectorFileUrl(value),
      (error: unknown) => error instanceof ConnectorError && ["connector_file_download_forbidden", "connector_file_download_malformed"].includes(error.code),
    );
  }
});

test("regional host acceptance never substitutes''',
              'malformed URL fail-closed assertion',
          )
          test_path.write_text(tests, encoding='utf-8')
          PY
          git fetch origin main
          git checkout origin/main -- .github/workflows/ci.yml
          rm -f .github/workflows/odl-req-027-fix.yml .odl-req-027-correction-trigger
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: keep Zen transport mocks explicit"
          git push origin HEAD:feature/odl-req-027-regional-attachments-zen-post

  validate:
    if: github.head_ref != 'feature/odl-req-027-regional-attachments-zen-post'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
      - name: Type check
        shell: bash
        run: |
          set -o pipefail
          npm run type-check 2>&1 | tee typecheck.log
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test.log
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-diagnostics-${{ github.event_name }}
          path: |
            typecheck.log
            test.log
          if-no-files-found: ignore
          retention-days: 1
      - name: Production dependency security gate
        run: npm audit --audit-level=high --omit=dev
      - name: Full dependency advisory report
        continue-on-error: true
        run: npm audit --audit-level=high
      - name: Dry-run Worker bundle with non-secret test placeholders
        run: |
          cp wrangler.jsonc wrangler.ci.jsonc
          sed -i 's/REPLACE_WITH_ALLOWED_ONEDRIVE_FOLDER/CI_TEST_ROOT/g' wrangler.ci.jsonc
          sed -i 's/REPLACE_WITH_KV_NAMESPACE_ID/00000000000000000000000000000000/g' wrangler.ci.jsonc
          npx wrangler deploy --dry-run --config wrangler.ci.jsonc --outdir dist
      - name: Upload non-secret Worker bundle
        uses: actions/upload-artifact@v4
        with:
          name: worker-bundle-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 1

  deploy-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 3f67b673280f2119de4eedd09745e20f
      WORKER_NAME: nikolay-onedrive-mcp
      OPENING_VERSION_ID: edc3677f-15c3-40df-aea2-f7fbe8a26459
      OPENING_DEPLOYMENT_ID: 995fdd5c-6342-490d-9df2-b19483457a2a
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
      - name: Generate production configuration
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          cfg = json.loads(Path('wrangler.jsonc').read_text())
          sha = os.environ['GITHUB_SHA']
          cfg['name'] = os.environ['WORKER_NAME']
          cfg['keep_vars'] = True
          cfg['kv_namespaces'] = [{'binding': 'OAUTH_KV', 'id': 'a3ead543dad24b8596ab9193b10f1b9f'}]
          cfg['vars'].update({
            'CONNECTOR_NAME': 'OneDrive Live MCP',
            'ONEDRIVE_ROOT': 'Работа',
            'MAX_FILE_MB': '20',
            'MAX_ORIGINAL_FILE_MB': '25',
            'MAX_TEXT_WRITE_KB': '4096',
            'MAX_READ_CHARS': '50000',
            'CACHE_TTL_SECONDS': '604800',
            'MAX_IMAGE_INPUT_MB': '15',
            'MAX_IMAGE_PIXELS': '40000000',
            'MAX_IMAGE_DIMENSION': '8192',
            'MAX_IMAGE_PAGES': '8',
            'IMAGE_PROCESSING_TIMEOUT_MS': '15000',
            'INTEGRITY_LEASE_SECONDS': '600',
            'PAID_MAX_SOURCE_MB': '500',
            'PAID_VISUAL_PARSE_MB': '40',
            'PAID_RENDER_ORIGIN': 'https://nikolay-onedrive-mcp.fdas201290.workers.dev',
            'VISUAL_CLASSIFIER_PROVIDER': 'openai',
            'VISUAL_CLASSIFIER_MODEL': 'gpt-5.2-2025-12-11',
            'OPENCODE_ZEN_MODEL': 'mimo-v2.5-free',
            'OPENCODE_ZEN_DISCOVERY_TTL_SECONDS': '3600',
            'VISUAL_CLASSIFIER_CONCURRENCY': '2',
            'VISUAL_CLASSIFIER_MAX_DIMENSION': '1280',
            'VISUAL_CLASSIFIER_JPEG_QUALITY': '82',
            'VISUAL_RUBRIC_VERSION': 'uca-visual-rubric-2026-08-02',
            'VISUAL_PROMPT_VERSION': 'visual-source-classifier-opencode-mimo-2026-08-02',
            'VISUAL_RENDERER_VERSION': 'pdfjs-cache-v1',
            'WORKER_DEPLOYMENT_ID': f'repo-{sha}',
          })
          Path('wrangler.production.json').write_text(json.dumps(cfg, ensure_ascii=False, indent=2) + '\n')
          PY
      - name: Verify opening lease and binding surfaces
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json")
          curl -fsS "${auth[@]}" "$api/workers/scripts/$WORKER_NAME/deployments" > pre-deployments.json
          jq -e --arg d "$OPENING_DEPLOYMENT_ID" --arg v "$OPENING_VERSION_ID" '.success == true and .result.deployments[0].id == $d and .result.deployments[0].versions == [{version_id:$v,percentage:100}]' pre-deployments.json >/dev/null
          curl -fsS "${auth[@]}" "$api/workers/scripts/$WORKER_NAME/settings" > pre-settings.json
          jq -S '[.result.bindings[] | {name,type}] | sort_by(.name)' pre-settings.json > pre-bindings.json
          jq -e '
            any(.[]; .name == "VISUAL_CATALOGUE_WORKFLOW" and .type == "workflow") and
            any(.[]; .name == "PAID_WORKFLOW" and .type == "workflow") and
            any(.[]; .name == "PAID_JOBS" and .type == "queue") and
            any(.[]; .name == "ARTIFACTS" and .type == "r2_bucket") and
            any(.[]; .name == "IMAGES" and .type == "images") and
            any(.[]; .name == "MCP_OBJECT" and .type == "durable_object_namespace") and
            any(.[]; .name == "AUTH_STATE" and .type == "durable_object_namespace") and
            any(.[]; .name == "PAID_COORDINATOR" and .type == "durable_object_namespace") and
            any(.[]; .name == "AI" and .type == "ai") and
            any(.[]; .name == "OAUTH_KV" and .type == "kv_namespace")
          ' pre-bindings.json >/dev/null
          curl -fsS "${auth[@]}" "$api/workers/scripts/$WORKER_NAME/secrets" > pre-secrets.json
          jq -S '[.result[] | {name,type}] | sort_by(.name)' pre-secrets.json > pre-secret-bindings.json
          jq -e 'any(.[]; .name == "OPENCODE_ZEN_API_KEY" and .type == "secret_text")' pre-secret-bindings.json >/dev/null
      - name: Deploy exact merged main
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          npx wrangler deploy --config wrangler.production.json --name "$WORKER_NAME" --message "Deploy ODL-REQ-025 exact main $GITHUB_SHA" --tag "odl-req-025-${GITHUB_SHA:0:12}" 2>&1 | tee deployment.log
      - name: Verify deployment, traffic, bindings, secrets, and health
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json")
          curl -fsS "${auth[@]}" "$api/workers/scripts/$WORKER_NAME/deployments" > post-deployments.json
          jq -e --arg old "$OPENING_DEPLOYMENT_ID" '.success == true and .result.deployments[0].id != $old and (.result.deployments[0].versions|length)==1 and .result.deployments[0].versions[0].percentage==100' post-deployments.json >/dev/null
          deployment_id=$(jq -r '.result.deployments[0].id' post-deployments.json)
          version_id=$(jq -r '.result.deployments[0].versions[0].version_id' post-deployments.json)
          curl -fsS "${auth[@]}" "$api/workers/scripts/$WORKER_NAME/versions?deployable=true" > post-versions.json
          version_number=$(jq -r --arg v "$version_id" '[.result.items[]|select(.id==$v)][0].number' post-versions.json)
          test "$version_number" != "null"
          curl -fsS "${auth[@]}" "$api/workers/scripts/$WORKER_NAME/settings" > post-settings.json
          jq -S '[.result.bindings[] | {name,type}] | sort_by(.name)' post-settings.json > post-bindings.json
          cmp pre-bindings.json post-bindings.json
          curl -fsS "${auth[@]}" "$api/workers/scripts/$WORKER_NAME/secrets" > post-secrets.json
          jq -S '[.result[] | {name,type}] | sort_by(.name)' post-secrets.json > post-secret-bindings.json
          cmp pre-secret-bindings.json post-secret-bindings.json
          health=$(curl -fsS --retry 8 --retry-all-errors --retry-delay 2 "https://nikolay-onedrive-mcp.fdas201290.workers.dev/health")
          jq -e '.ok == true' <<<"$health" >/dev/null
          zen_secret_present=$(jq 'any(.[]; .name == "OPENCODE_ZEN_API_KEY" and .type == "secret_text")' post-secret-bindings.json)
          jq -n --arg sourceCommit "$GITHUB_SHA" --arg deploymentId "$deployment_id" --arg versionId "$version_id" --argjson versionNumber "$version_number" --argjson zenSecretPresent "$zen_secret_present" '{sourceCommit:$sourceCommit,deploymentId:$deploymentId,versionId:$versionId,versionNumber:$versionNumber,trafficPercent:100,bindingsUnchanged:true,secretBindingsUnchanged:true,opencodeZenSecretPresent:$zenSecretPresent,healthHttp200:true}' > deployment-evidence.json
          cat deployment-evidence.json
      - name: Upload sanitized deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: odl-req-025-deployment-evidence
          path: |
            deployment.log
            deployment-evidence.json
            pre-bindings.json
            post-bindings.json
            pre-secret-bindings.json
            post-secret-bindings.json
          if-no-files-found: warn
          retention-days: 7
