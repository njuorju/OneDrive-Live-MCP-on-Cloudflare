name: CI

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  apply-odl-req-025:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ github.token }}
      - name: Verify and apply exact implementation patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$(git branch --show-current)" = "${{ github.event.pull_request.head.ref }}"
          test "$(git rev-parse origin/main)" = "6b02965b0a29d2ab11c98ea1550321384fb1ccf9"
          cat .odl-req-025/patch.part* | base64 --decode > /tmp/odl-req-025.diff.gz
          echo "79386bc4b13f2a281b7d0397a22fdaa35cdcd080794662ef01bcf1e3322ae678  /tmp/odl-req-025.diff.gz" | sha256sum --check
          gzip --decompress --stdout /tmp/odl-req-025.diff.gz > /tmp/odl-req-025.diff
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          git apply --check /tmp/odl-req-025.diff
          git apply /tmp/odl-req-025.diff
          rm -rf .odl-req-025 .github/workflows/odl-req-025-apply.yml
          git add -A
          cat > /tmp/expected-files <<'EOF'
          .github/workflows/ci.yml
          src/connector-files.ts
          src/file-backed-text.ts
          src/index-closeout.ts
          src/visual-catalogue-opencode.ts
          src/visual-catalogue-runtime.ts
          src/visual-catalogue-tools.ts
          src/visual-catalogue-zen-responses.ts
          src/visual-classifier-capability-zen-responses.ts
          src/visual-classifier-capability.ts
          test/connector-file-contract.test.ts
          test/file-backed-text.test.ts
          test/production-rollout.test.ts
          test/visual-catalogue-zen-responses.test.ts
          EOF
          sed -i 's/^          //' /tmp/expected-files
          git diff origin/main --name-only --diff-filter=ACMR | sort > /tmp/actual-files
          diff -u /tmp/expected-files /tmp/actual-files
      - name: Commit focused implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "ODL-REQ-025: repair attachments and add Zen Responses vision"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
