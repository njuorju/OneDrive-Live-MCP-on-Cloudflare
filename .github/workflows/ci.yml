name: ODL-REQ-025 dependency lock repair

on:
  push:
    branches:
      - feature/odl-req-025-attachment-zen-responses

permissions:
  contents: write

concurrency:
  group: odl-req-025-lock-repair
  cancel-in-progress: true

jobs:
  repair-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/odl-req-025-attachment-zen-responses
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"
          cache: npm
      - name: Regenerate exact lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
      - name: Production dependency security gate
        run: npm audit --audit-level=moderate --omit=dev
      - name: Type check
        run: npm run type-check
      - name: Test
        run: npm test
      - name: Wrangler production dry-run
        run: |
          cp wrangler.jsonc wrangler.ci.jsonc
          sed -i 's/REPLACE_WITH_ALLOWED_ONEDRIVE_FOLDER/CI_TEST_ROOT/g' wrangler.ci.jsonc
          sed -i 's/REPLACE_WITH_KV_NAMESPACE_ID/00000000000000000000000000000000/g' wrangler.ci.jsonc
          npx wrangler deploy --dry-run --config wrangler.ci.jsonc --outdir dist
      - name: Commit regenerated lockfile only
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- package.json
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh audited dependency lock"
          git push origin HEAD:feature/odl-req-025-attachment-zen-responses
