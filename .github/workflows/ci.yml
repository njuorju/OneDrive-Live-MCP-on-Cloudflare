name: ODL-REQ-025 commit validated lock artifact

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: odl-req-025-lock-commit-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  commit-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/odl-req-025-attachment-zen-responses
          fetch-depth: 1
      - name: Download exact validated artifact
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/njuorju/OneDrive-Live-MCP-on-Cloudflare/actions/artifacts/8891728531/zip" \
            -o lock-artifact.zip
          rm -rf lock-artifact
          mkdir lock-artifact
          unzip -q lock-artifact.zip -d lock-artifact
          test "$(sha256sum lock-artifact/package-lock.json | awk '{print $1}')" = "eee48aa981153e64a2f7fb2200921851dcefa8dcff8d63bc20acf9468db12b70"
          cp lock-artifact/package-lock.json package-lock.json
      - name: Commit package lock only
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- package.json
          git add package-lock.json
          test -n "$(git diff --cached --name-only)"
          test "$(git diff --cached --name-only)" = "package-lock.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh audited dependency lock"
          git push origin HEAD:feature/odl-req-025-attachment-zen-responses
