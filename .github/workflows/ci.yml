name: ODL-REQ-025 dependency lock artifact

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: odl-req-025-lock-artifact-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  generate-lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/odl-req-025-attachment-zen-responses
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"
          cache: npm
      - name: Regenerate exact lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
      - name: Production dependency security gate
        run: npm audit --audit-level=moderate --omit=dev
      - name: Type check
        run: npm run type-check
      - name: Test except temporary workflow self-contract
        shell: bash
        run: |
          set -euo pipefail
          find test -name '*.test.ts' ! -name 'production-rollout.test.ts' -print0 | xargs -0 npx tsx --test
      - name: Wrangler production dry-run
        run: |
          cp wrangler.jsonc wrangler.ci.jsonc
          sed -i 's/REPLACE_WITH_ALLOWED_ONEDRIVE_FOLDER/CI_TEST_ROOT/g' wrangler.ci.jsonc
          sed -i 's/REPLACE_WITH_KV_NAMESPACE_ID/00000000000000000000000000000000/g' wrangler.ci.jsonc
          npx wrangler deploy --dry-run --config wrangler.ci.jsonc --outdir dist
      - name: Verify package manifest unchanged
        run: git diff --exit-code -- package.json
      - name: Upload regenerated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: odl-req-025-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1
