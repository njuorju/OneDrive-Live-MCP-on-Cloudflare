name: ODL-REQ-037 PR apply

on:
  pull_request:
    branches: [main]
    types: [opened, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"
          cache: npm
      - name: Restore exact reviewed JPEG fixture bytes
        shell: bash
        run: |
          cat .github/odl037-fixture/part* | base64 --decode > /tmp/odl037-fixture.jpg
          test "$(wc -c < /tmp/odl037-fixture.jpg)" = "14298"
          test "$(sha256sum /tmp/odl037-fixture.jpg | cut -d' ' -f1)" = "da50bd35fd2266fdef0400dbc52968b44e5e743f5654f6b99f0cecbb68cc228a"
          file /tmp/odl037-fixture.jpg
      - name: Extract and apply bounded repair script
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap
          source = Path('.github/workflows/odl-req-037-bootstrap.yml').read_text()
          marker = "cat > /tmp/odl037_patch.py <<'PY'\n"
          script = source.split(marker, 1)[1].split("\n          PY\n", 1)[0]
          Path('/tmp/odl037_patch.py').write_text(textwrap.dedent(script))
          PY
          python /tmp/odl037_patch.py
          git diff --check
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
      - name: Type check
        run: npm run type-check
      - name: Complete test suite
        run: npm test
      - name: Production dependency audit
        run: npm audit --audit-level=high --omit=dev
      - name: Exact Worker dry-run bundle
        shell: bash
        run: |
          cp wrangler.jsonc wrangler.ci.jsonc
          sed -i 's/REPLACE_WITH_ALLOWED_ONEDRIVE_FOLDER/CI_TEST_ROOT/g' wrangler.ci.jsonc
          sed -i 's/REPLACE_WITH_KV_NAMESPACE_ID/00000000000000000000000000000000/g' wrangler.ci.jsonc
          npx wrangler deploy --dry-run --config wrangler.ci.jsonc --outdir dist-bootstrap
      - name: Commit bounded repair and remove bootstrap residue
        shell: bash
        run: |
          rm .github/workflows/odl-req-037-bootstrap.yml
          rm .github/workflows/odl-req-037-pr-apply.yml
          rm .github/odl-req-037-trigger
          rm -rf .github/odl037-fixture
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src test .github
          git commit -m "fix: replace ambiguous vision probe and normalize receipts"
          git push origin HEAD:${{ github.head_ref }}
