name: ODL-REQ-035 type contract repair

on:
  push:
    branches:
      - fix/odl-req-035-luna-visual-fixture-recognition

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply type patch and self-remove
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 --decode | gzip --decompress > /tmp/typefix.patch
          echo 'bc2adb9f30ce05641560f43cc4ab507a3a225f05f9876d868417deb783862d0f  /tmp/typefix.patch' | sha256sum --check --strict
          git apply --check /tmp/typefix.patch
          git apply /tmp/typefix.patch
          git rm .github/workflows/odl-req-035-typefix.yml
          git add src/visual-classifier-capability-zen-responses.ts
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: separate coarse and semantic vision classes'
          git push origin HEAD:fix/odl-req-035-luna-visual-fixture-recognition
