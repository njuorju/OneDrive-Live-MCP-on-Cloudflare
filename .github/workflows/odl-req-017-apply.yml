name: Apply ODL-REQ-017 mounted UTF-8 file support

on:
  push:
    branches:
      - work/odl-req-017-mounted-utf8-files

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/odl-req-017-mounted-utf8-files
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"
          cache: npm
      - name: Apply bounded registration and tests
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          module = Path('src/file-backed-text.ts')
          source = module.read_text()
          if 'connectorFileInputSchema' not in source:
              source = source.replace('import type { GraphDriveItem } from "./types";\n', 'import type { GraphDriveItem } from "./types";\nimport { z } from "zod";\n')
              source = source.replace('const SHA256_PATTERN = /^[0-9a-f]{64}$/;\n', '''export const connectorFileInputSchema = z.string()
            .min(1)
            .max(20_000)
            .meta({ format: "binary" })
            .describe("Mounted ChatGPT workspace file. Pass the local mounted path; the connector runtime resolves it to a bounded file reference.");

          const SHA256_PATTERN = /^[0-9a-f]{64}$/;
          ''')
          old = '''  const bytes = await readBoundedResponse(response, maximumBytes);
            const sourceMimeType = response.headers.get("content-type");
            const signature = validateFileSignature(safeName, bytesBuffer(bytes), sourceMimeType);
            if (!signature.compatible) {
              throw new ConnectorError("binary_file_rejected", "The connector file does not match the requested allowlisted UTF-8 text type.", {
                details: { detected: signature.detected, reason: signature.reason ?? null },
              });
            }
            const text = decodeStrictUtf8(bytes);
          '''
          new = '''  const bytes = await readBoundedResponse(response, maximumBytes);
            const sourceMimeType = response.headers.get("content-type");
            const text = decodeStrictUtf8(bytes);
            const signature = validateFileSignature(safeName, bytesBuffer(bytes), sourceMimeType);
            if (!signature.compatible) {
              throw new ConnectorError("binary_file_rejected", "The connector file does not match the requested allowlisted UTF-8 text type.", {
                details: { detected: signature.detected, reason: signature.reason ?? null },
              });
            }
          '''
          if old in source:
              source = source.replace(old, new)

          marker = 'export async function replaceCataloguePairFromConnectorFilesStrict('
          if 'export async function coordinatePairReplacement' not in source:
              helper = '''export async function coordinatePairReplacement<TFirst, TSecond>(
            replaceFirst: () => Promise<TFirst>,
            replaceSecond: () => Promise<TSecond>,
            rollbackFirst: (first: TFirst) => Promise<void>,
          ): Promise<{ first: TFirst; second: TSecond }> {
            const first = await replaceFirst();
            try {
              const second = await replaceSecond();
              return { first, second };
            } catch (error) {
              const second = asConnectorError(error);
              try {
                await rollbackFirst(first);
              } catch (rollbackError) {
                const rollback = asConnectorError(rollbackError);
                throw new ConnectorError("catalogue_pair_ambiguous_rollback_failed", "The paired publication failed and the first-file rollback could not be verified.", {
                  retryable: false,
                  details: { secondErrorCode: second.code, rollbackErrorCode: rollback.code },
                });
              }
              const ambiguousSecond = ["graph_network_error", "graph_timeout", "graph_unreachable", "graph_server_error"].includes(second.code);
              throw new ConnectorError(
                ambiguousSecond ? "catalogue_pair_ambiguous_second_write_first_rolled_back" : "catalogue_pair_second_write_failed_first_rolled_back",
                ambiguousSecond
                  ? "The second replacement had an ambiguous upstream outcome; the first replacement was restored exactly."
                  : "The second replacement failed; the first replacement was restored exactly.",
                { retryable: false, details: { secondErrorCode: second.code, firstRollbackVerified: true } },
              );
            }
          }

          '''
              source = source.replace(marker, helper + marker)

          start = source.index('  let csvReplaced: VerifiedItem | null = null;')
          end = source.rindex('\n}')
          replacement = '''  const coordinated = await coordinatePairReplacement(
            () => putReplacementBytes(env, userId, csvSource, input.expectedCsvETag, csvIncoming.bytes),
            () => putReplacementBytes(env, userId, jsonSource, input.expectedJsonETag, jsonIncoming.bytes),
            async (csvReplaced) => {
              if (!csvReplaced.item.eTag) throw new ConnectorError("etag_missing", "The first replacement returned no eTag for rollback.");
              const currentCsv = await verifyItemInsideRoot(env, userId, csvSource.item.id);
              const rolledBack = await putReplacementBytes(env, userId, currentCsv, csvReplaced.item.eTag, previousCsv);
              await verifyExactLiveBytes(env, userId, rolledBack, previousCsv, previousCsvHash);
            },
          );
          const [csvVerified, jsonVerified] = await Promise.all([
            verifyExactLiveBytes(env, userId, coordinated.first, csvIncoming.bytes, csvIncoming.sha256),
            verifyExactLiveBytes(env, userId, coordinated.second, jsonIncoming.bytes, jsonIncoming.sha256),
          ]);
          const readBackCsv = new TextDecoder("utf-8", { fatal: true }).decode(csvIncoming.bytes);
          const readBackJson = new TextDecoder("utf-8", { fatal: true }).decode(jsonIncoming.bytes);
          const readBackParity = validateCataloguePairBytes(readBackCsv, readBackJson, input.recordKeyField, input.jsonRecordsPath ?? "", input.expectedRecordCount);
          return {
            csv: publicationResult(csvVerified.item, csvVerified.byteLength, csvVerified.sha256, input.expectedCsvETag),
            json: publicationResult(jsonVerified.item, jsonVerified.byteLength, jsonVerified.sha256, input.expectedJsonETag),
            parity: readBackParity,
            coordinatedOperation: true,
            rollbackRequired: false,
            stagedPreviousHashes: { csvSha256: previousCsvHash, jsonSha256: previousJsonHash },
          };
          '''
          if start != -1:
              source = source[:start] + replacement + source[end:]
          module.write_text(source)

          index = Path('src/index.ts')
          text = index.read_text()
          import_anchor = 'import { ConnectorError, safeErrorResult } from "./errors";\n'
          import_block = '''import {
            connectorFileInputSchema,
            createTextFileFromConnectorFileStrict,
            replaceCataloguePairFromConnectorFilesStrict,
            replaceTextFileFromConnectorFileStrict,
          } from "./file-backed-text";
          '''
          if import_block not in text:
              text = text.replace(import_anchor, import_anchor + import_block)

          registration_anchor = '''    this.server.registerTool(
              "rename_item",
          '''
          registrations = '''    this.server.registerTool(
            "create_text_file_from_file",
            {
              title: "Create exact UTF-8 text file from mounted file",
              description: "Create one allowlisted UTF-8 file from a top-level mounted ChatGPT workspace file. Exact submitted bytes are hashed, uploaded without normalization, and read back for verification. Filename conflicts fail.",
              inputSchema: {
                file: connectorFileInputSchema,
                destinationPath: z.string().max(1000).default(""),
                filename: z.string().min(1).max(255),
                expectedSha256: z.string().regex(/^[0-9a-fA-F]{64}$/).optional(),
              },
              annotations: MUTATING,
            },
            async ({ file, destinationPath, filename, expectedSha256 }) => {
              try { return textResult(await createTextFileFromConnectorFileStrict(this.env, this.userId(), file, destinationPath, filename, expectedSha256)); }
              catch (error) { return errorResult(error); }
            },
          );

          this.server.registerTool(
            "replace_text_file_from_file",
            {
              title: "Replace exact UTF-8 text file from mounted file",
              description: "Replace one allowlisted UTF-8 file from a top-level mounted ChatGPT workspace file only when expectedETag exactly matches. Exact submitted bytes are preserved and read back for verification.",
              inputSchema: {
                file: connectorFileInputSchema,
                itemId: z.string().min(1).max(500),
                expectedETag: z.string().min(1).max(1000),
                expectedSha256: z.string().regex(/^[0-9a-fA-F]{64}$/).optional(),
              },
              annotations: MUTATING,
            },
            async ({ file, itemId, expectedETag, expectedSha256 }) => {
              try { return textResult(await replaceTextFileFromConnectorFileStrict(this.env, this.userId(), file, itemId, expectedETag, expectedSha256)); }
              catch (error) { return errorResult(error); }
            },
          );

          this.server.registerTool(
            "replace_catalogue_pair_from_files",
            {
              title: "Publish exact CSV and JSON catalogue files",
              description: "Validate and publish a mounted CSV/JSON catalogue pair as full files. Supports a JSON array or an object records path, checks stable-key parity before mutation, confirms both eTags, rolls back the first replacement if the second fails, and verifies both read-backs.",
              inputSchema: {
                csvFile: connectorFileInputSchema,
                jsonFile: connectorFileInputSchema,
                csvItemId: z.string().min(1).max(500),
                jsonItemId: z.string().min(1).max(500),
                expectedCsvETag: z.string().min(1).max(1000),
                expectedJsonETag: z.string().min(1).max(1000),
                recordKeyField: z.string().min(1).max(200),
                jsonRecordsPath: z.string().max(1000).default(""),
                expectedRecordCount: z.number().int().min(0).optional(),
              },
              annotations: MUTATING,
            },
            async (input) => {
              try { return textResult(await replaceCataloguePairFromConnectorFilesStrict(this.env, this.userId(), input)); }
              catch (error) { return errorResult(error); }
            },
          );

          '''
          if '"create_text_file_from_file"' not in text:
              text = text.replace(registration_anchor, registrations + registration_anchor)
          index.write_text(text)

          test = Path('test/file-backed-text.test.ts')
          test.write_text(r'''import test from "node:test";
          import assert from "node:assert/strict";
          import { z } from "zod";
          import { ConnectorError } from "../src/errors";
          import {
            connectorFileInputSchema,
            coordinatePairReplacement,
            loadConnectorTextFile,
            sha256HexBytes,
            validateCataloguePairBytes,
          } from "../src/file-backed-text";

          const ref = "https://files.openaiusercontent.com/connector/test-fixture";
          const responseFor = (bytes: Uint8Array, type = "text/plain; charset=utf-8") => async () => new Response(bytes, { status: 200, headers: { "content-type": type, "content-length": String(bytes.byteLength) } });

          test("connector file schema is exposed as a binary file input", () => {
            const schema = z.toJSONSchema(connectorFileInputSchema) as Record<string, unknown>;
            assert.equal(schema.type, "string");
            assert.equal(schema.format, "binary");
          });

          test("mounted UTF-8 bytes are preserved exactly and hashed", async () => {
            const bytes = new TextEncoder().encode("id,name\r\n1,Нарын\r\n");
            const loaded = await loadConnectorTextFile(ref, "fixture.csv", 1024, undefined, responseFor(bytes));
            assert.deepEqual(loaded.bytes, bytes);
            assert.equal(loaded.byteLength, bytes.byteLength);
            assert.equal(loaded.sha256, await sha256HexBytes(bytes));
          });

          test("malformed UTF-8 is rejected", async () => {
            const bytes = Uint8Array.from([0xc3, 0x28]);
            await assert.rejects(() => loadConnectorTextFile(ref, "fixture.txt", 1024, undefined, responseFor(bytes)), (error: unknown) => error instanceof ConnectorError && error.code === "text_not_utf8");
          });

          test("binary control bytes are rejected", async () => {
            const bytes = Uint8Array.from([0x41, 0x00, 0x42]);
            await assert.rejects(() => loadConnectorTextFile(ref, "fixture.txt", 1024, undefined, responseFor(bytes)), (error: unknown) => error instanceof ConnectorError && error.code === "binary_file_rejected");
          });

          test("over-limit connector files fail before publication", async () => {
            const bytes = new TextEncoder().encode("12345");
            await assert.rejects(() => loadConnectorTextFile(ref, "fixture.txt", 4, undefined, responseFor(bytes)), (error: unknown) => error instanceof ConnectorError && error.code === "text_too_large");
          });

          test("arbitrary internet URLs are rejected", async () => {
            const bytes = new TextEncoder().encode("safe");
            await assert.rejects(() => loadConnectorTextFile("https://example.com/file.txt", "fixture.txt", 1024, undefined, responseFor(bytes)), (error: unknown) => error instanceof ConnectorError && error.code === "untrusted_connector_file");
          });

          test("catalogue parity supports JSON arrays", () => {
            const result = validateCataloguePairBytes("id,name\n1,A\n2,B\n", JSON.stringify([{ id: "1", name: "A" }, { id: "2", name: "B" }]), "id", "", 2);
            assert.equal(result.recordCount, 2);
            assert.equal(result.sharedFieldParity, true);
          });

          test("catalogue parity supports object records path", () => {
            const result = validateCataloguePairBytes("id,name\n1,A\n", JSON.stringify({ schema: { version: 1 }, records: [{ id: "1", name: "A" }] }), "id", "records", 1);
            assert.deepEqual(result.sharedFields, ["id", "name"]);
          });

          test("catalogue mismatch and duplicate keys fail before writes", () => {
            assert.throws(() => validateCataloguePairBytes("id,name\n1,A\n", JSON.stringify([{ id: "2", name: "A" }]), "id"), (error: unknown) => error instanceof ConnectorError && error.code === "catalogue_key_set_mismatch");
            assert.throws(() => validateCataloguePairBytes("id,name\n1,A\n1,B\n", JSON.stringify([{ id: "1", name: "A" }]), "id"), (error: unknown) => error instanceof ConnectorError && error.code === "record_key_duplicate");
          });

          test("second replacement failure rolls the first replacement back", async () => {
            const calls: string[] = [];
            await assert.rejects(
              () => coordinatePairReplacement(
                async () => { calls.push("first"); return { etag: "new" }; },
                async () => { calls.push("second"); throw new ConnectorError("etag_conflict", "stale"); },
                async () => { calls.push("rollback"); },
              ),
              (error: unknown) => error instanceof ConnectorError && error.code === "catalogue_pair_second_write_failed_first_rolled_back",
            );
            assert.deepEqual(calls, ["first", "second", "rollback"]);
          });

          test("rollback failure is reported as ambiguous", async () => {
            await assert.rejects(
              () => coordinatePairReplacement(
                async () => "first",
                async () => { throw new ConnectorError("graph_network_error", "ambiguous"); },
                async () => { throw new ConnectorError("etag_conflict", "rollback stale"); },
              ),
              (error: unknown) => error instanceof ConnectorError && error.code === "catalogue_pair_ambiguous_rollback_failed",
            );
          });
          '''.replace(/^          /gm, ''))

          Path('.github/workflows/odl-req-017-apply.yml').unlink()
          PY
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Type check and test
        run: npm run check
      - name: Commit bounded implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/index.ts src/file-backed-text.ts test/file-backed-text.test.ts .github/workflows/odl-req-017-apply.yml
          git commit -m "Implement ODL-REQ-017 mounted UTF-8 publication tools"
          git push origin HEAD:work/odl-req-017-mounted-utf8-files
