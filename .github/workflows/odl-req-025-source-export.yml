name: ODL-REQ-025 source export

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Verify exact PR head
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          git status --short
      - name: Package source
        run: |
          set -euo pipefail
          tar --exclude=.git --exclude=node_modules --exclude=dist --exclude=dist-production -czf /tmp/odl-req-025-source.tgz .
          sha256sum /tmp/odl-req-025-source.tgz > /tmp/odl-req-025-source.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: odl-req-025-source
          path: |
            /tmp/odl-req-025-source.tgz
            /tmp/odl-req-025-source.sha256
          retention-days: 1
