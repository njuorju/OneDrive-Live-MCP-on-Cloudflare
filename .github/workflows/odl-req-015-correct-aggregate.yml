name: Correct ODL-REQ-015 aggregate attribution

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/odl-req-015-permission-provenance
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Locate link attribution block
        shell: bash
        run: grep -nF 'if (counts.total === 0) {' src/visual-phase2.ts
      - name: Remove link attribution block
        shell: bash
        run: |
          line=$(grep -nF 'if (counts.total === 0) {' src/visual-phase2.ts | head -1 | cut -d: -f1)
          test -n "$line"
          sed -i "${line},$((line+3))d" src/visual-phase2.ts
          ! grep -qF 'if (counts.total === 0) {' src/visual-phase2.ts
      - name: Add aggregate assertion
        shell: bash
        run: |
          grep -nF 'assert.equal(summary.directPermissionCount, 1);' test/permission-provenance.test.ts
          sed -i '/assert.equal(summary.directPermissionCount, 1);/a\  assert.equal(summary.externalPrincipalCount, 0);' test/permission-provenance.test.ts
          grep -qF 'assert.equal(summary.externalPrincipalCount, 0);' test/permission-provenance.test.ts
      - name: Verify
        run: npm ci && npm run check
      - name: Commit correction and remove temporary files
        shell: bash
        run: |
          rm .github/workflows/odl-req-015-correct-aggregate.yml .github/odl-req-015-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/visual-phase2.ts test/permission-provenance.test.ts .github/workflows/odl-req-015-correct-aggregate.yml .github/odl-req-015-trigger
          git commit -m "Correct permission aggregate attribution [ODL-REQ-015]"
          git push origin HEAD:work/odl-req-015-permission-provenance
