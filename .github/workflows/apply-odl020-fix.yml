name: Apply ODL-REQ-020 serialization fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'work/odl-req-020-fix-helper'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/odl-req-020-fix-helper
          fetch-depth: 0
      - name: Apply bounded fix and remove workflow
        shell: bash
        env:
          PATCH_B64: 
        run: |
          printf '%s' "$PATCH_B64" | base64 -d > /tmp/fix.patch
          git apply --check /tmp/fix.patch
          git apply /tmp/fix.patch
          rm .github/workflows/apply-odl020-fix.yml
          git config user.name 'ODL-REQ-020 automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'ODL-REQ-020: make capability receipt workflow-safe'
          git push origin HEAD:work/odl-req-020-fix-helper
