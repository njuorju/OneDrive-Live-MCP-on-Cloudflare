name: Deploy production

run-name: Deploy ${{ inputs.request_id }} at ${{ inputs.expected_main_sha }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Bounded request identifier, for example ODL-REQ-030
        required: true
        type: string
      expected_main_sha:
        description: Exact current main commit to deploy
        required: true
        type: string
      expected_opening_version_id:
        description: Exact live Worker version ID before deployment
        required: true
        type: string
      expected_opening_deployment_id:
        description: Exact live deployment ID before deployment
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: onedrive-live-production-deployment
  cancel-in-progress: false

jobs:
  deploy-production:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 3f67b673280f2119de4eedd09745e20f
      WORKER_NAME: nikolay-onedrive-mcp
      REQUEST_ID: ${{ inputs.request_id }}
      SOURCE_SHA: ${{ inputs.expected_main_sha }}
      OPENING_VERSION_ID: ${{ inputs.expected_opening_version_id }}
      OPENING_DEPLOYMENT_ID: ${{ inputs.expected_opening_deployment_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Verify exact current main and normalize request ID
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$SOURCE_SHA" = "${SOURCE_SHA,,}"
          test "${#SOURCE_SHA}" = "40"
          test -n "$REQUEST_ID"
          request_slug="$(printf '%s' "$REQUEST_ID" | tr '[:upper:]' '[:lower:]' | tr -cs 'a-z0-9-' '-' | sed 's/^-//;s/-$//' | cut -c1-40)"
          test -n "$request_slug"
          printf 'REQUEST_SLUG=%s\n' "$request_slug" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
      - name: Generate production configuration
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path

          cfg = json.loads(Path("wrangler.jsonc").read_text())
          sha = os.environ["SOURCE_SHA"]
          cfg["name"] = os.environ["WORKER_NAME"]
          cfg["keep_vars"] = True
          cfg["kv_namespaces"] = [
              {"binding": "OAUTH_KV", "id": "a3ead543dad24b8596ab9193b10f1b9f"}
          ]
          cfg["vars"].update({
              "CONNECTOR_NAME": "OneDrive Live MCP",
              "ONEDRIVE_ROOT": "Работа",
              "MAX_FILE_MB": "20",
              "MAX_ORIGINAL_FILE_MB": "25",
              "MAX_TEXT_WRITE_KB": "4096",
              "MAX_READ_CHARS": "50000",
              "CACHE_TTL_SECONDS": "604800",
              "MAX_IMAGE_INPUT_MB": "15",
              "MAX_IMAGE_PIXELS": "40000000",
              "MAX_IMAGE_DIMENSION": "8192",
              "MAX_IMAGE_PAGES": "8",
              "IMAGE_PROCESSING_TIMEOUT_MS": "15000",
              "INTEGRITY_LEASE_SECONDS": "600",
              "PAID_MAX_SOURCE_MB": "500",
              "PAID_VISUAL_PARSE_MB": "40",
              "PAID_RENDER_ORIGIN": "https://nikolay-onedrive-mcp.fdas201290.workers.dev",
              "VISUAL_CLASSIFIER_PROVIDER": "openai",
              "VISUAL_CLASSIFIER_MODEL": "gpt-5.2-2025-12-11",
              "OPENCODE_ZEN_MODEL": "mimo-v2.5-free",
              "OPENCODE_ZEN_DISCOVERY_TTL_SECONDS": "3600",
              "VISUAL_CLASSIFIER_CONCURRENCY": "2",
              "VISUAL_CLASSIFIER_MAX_DIMENSION": "1280",
              "VISUAL_CLASSIFIER_JPEG_QUALITY": "82",
              "VISUAL_RUBRIC_VERSION": "uca-visual-rubric-2026-08-02",
              "VISUAL_PROMPT_VERSION": "visual-source-classifier-opencode-mimo-2026-08-02",
              "VISUAL_RENDERER_VERSION": "pdfjs-cache-v1",
              "WORKER_DEPLOYMENT_ID": f"repo-{sha}",
          })
          Path("wrangler.production.json").write_text(
              json.dumps(cfg, ensure_ascii=False, indent=2) + "\n"
          )
          PY
      - name: Verify opening lease and binding surfaces
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$OPENING_VERSION_ID"
          test -n "$OPENING_DEPLOYMENT_ID"
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json")
          curl -fsS "${auth[@]}" "$api/workers/scripts/$WORKER_NAME/deployments" > pre-deployments.json
          jq -e --arg d "$OPENING_DEPLOYMENT_ID" --arg v "$OPENING_VERSION_ID" \
            '.success == true and .result.deployments[0].id == $d and .result.deployments[0].versions == [{version_id:$v,percentage:100}]' \
            pre-deployments.json >/dev/null
          curl -fsS "${auth[@]}" "$api/workers/scripts/$WORKER_NAME/settings" > pre-settings.json
          jq -S '[.result.bindings[] | {name,type}] | sort_by(.name)' pre-settings.json > pre-bindings.json
          test "$(jq length pre-bindings.json)" = "44"
          jq -e '
            any(.[]; .name == "VISUAL_CATALOGUE_WORKFLOW" and .type == "workflow") and
            any(.[]; .name == "PAID_WORKFLOW" and .type == "workflow") and
            any(.[]; .name == "PAID_JOBS" and .type == "queue") and
            any(.[]; .name == "ARTIFACTS" and .type == "r2_bucket") and
            any(.[]; .name == "IMAGES" and .type == "images") and
            any(.[]; .name == "MCP_OBJECT" and .type == "durable_object_namespace") and
            any(.[]; .name == "AUTH_STATE" and .type == "durable_object_namespace") and
            any(.[]; .name == "PAID_COORDINATOR" and .type == "durable_object_namespace") and
            any(.[]; .name == "AI" and .type == "ai") and
            any(.[]; .name == "OAUTH_KV" and .type == "kv_namespace")
          ' pre-bindings.json >/dev/null
          curl -fsS "${auth[@]}" "$api/workers/scripts/$WORKER_NAME/secrets" > pre-secrets.json
          jq -S '[.result[] | {name,type}] | sort_by(.name)' pre-secrets.json > pre-secret-bindings.json
          test "$(jq length pre-secret-bindings.json)" = "4"
          jq -e 'any(.[]; .name == "OPENCODE_ZEN_API_KEY" and .type == "secret_text")' pre-secret-bindings.json >/dev/null
      - name: Deploy exact merged main
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          npx wrangler deploy \
            --config wrangler.production.json \
            --name "$WORKER_NAME" \
            --message "Deploy $REQUEST_ID exact main $SOURCE_SHA" \
            --tag "${REQUEST_SLUG}-${SOURCE_SHA:0:12}" \
            2>&1 | tee deployment.log
      - name: Verify deployment, traffic, bindings, secrets, and health
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json")
          curl -fsS "${auth[@]}" "$api/workers/scripts/$WORKER_NAME/deployments" > post-deployments.json
          jq -e --arg old "$OPENING_DEPLOYMENT_ID" \
            '.success == true and .result.deployments[0].id != $old and (.result.deployments[0].versions|length)==1 and .result.deployments[0].versions[0].percentage==100' \
            post-deployments.json >/dev/null
          deployment_id="$(jq -r '.result.deployments[0].id' post-deployments.json)"
          version_id="$(jq -r '.result.deployments[0].versions[0].version_id' post-deployments.json)"
          curl -fsS "${auth[@]}" "$api/workers/scripts/$WORKER_NAME/versions?deployable=true" > post-versions.json
          version_number="$(jq -r --arg v "$version_id" '[.result.items[]|select(.id==$v)][0].number' post-versions.json)"
          test "$version_number" != "null"
          curl -fsS "${auth[@]}" "$api/workers/scripts/$WORKER_NAME/settings" > post-settings.json
          jq -e --arg source "repo-$SOURCE_SHA" \
            'any(.result.bindings[]; .name == "WORKER_DEPLOYMENT_ID" and .type == "plain_text" and .text == $source)' \
            post-settings.json >/dev/null
          jq -S '[.result.bindings[] | {name,type}] | sort_by(.name)' post-settings.json > post-bindings.json
          test "$(jq length post-bindings.json)" = "44"
          cmp pre-bindings.json post-bindings.json
          curl -fsS "${auth[@]}" "$api/workers/scripts/$WORKER_NAME/secrets" > post-secrets.json
          jq -S '[.result[] | {name,type}] | sort_by(.name)' post-secrets.json > post-secret-bindings.json
          test "$(jq length post-secret-bindings.json)" = "4"
          cmp pre-secret-bindings.json post-secret-bindings.json
          health="$(curl -fsS --retry 8 --retry-all-errors --retry-delay 2 "https://nikolay-onedrive-mcp.fdas201290.workers.dev/health")"
          jq -e '.ok == true' <<<"$health" >/dev/null
          zen_secret_present="$(jq 'any(.[]; .name == "OPENCODE_ZEN_API_KEY" and .type == "secret_text")' post-secret-bindings.json)"
          jq -n \
            --arg requestId "$REQUEST_ID" \
            --arg sourceCommit "$SOURCE_SHA" \
            --arg deploymentId "$deployment_id" \
            --arg versionId "$version_id" \
            --argjson versionNumber "$version_number" \
            --argjson zenSecretPresent "$zen_secret_present" \
            '{
              requestId:$requestId,
              sourceCommit:$sourceCommit,
              deploymentId:$deploymentId,
              versionId:$versionId,
              versionNumber:$versionNumber,
              trafficPercent:100,
              bindingsUnchanged:true,
              secretBindingsUnchanged:true,
              opencodeZenSecretPresent:$zenSecretPresent,
              healthHttp200:true
            }' > deployment-evidence.json
          cat deployment-evidence.json
      - name: Upload sanitized deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-deployment-evidence-${{ github.run_id }}
          path: |
            deployment.log
            deployment-evidence.json
            pre-bindings.json
            post-bindings.json
            pre-secret-bindings.json
            post-secret-bindings.json
          if-no-files-found: warn
          retention-days: 7
