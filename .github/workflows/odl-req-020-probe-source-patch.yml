name: ODL-REQ-020 probe source patch

on:
  push:
    branches:
      - fix/odl-req-020-synthetic-vision-probe

permissions:
  contents: write

jobs:
  apply-source-patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/odl-req-020-synthetic-vision-probe
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply exact bounded patch
        run: node scripts/apply-odl-req-020-probe-fix.mjs
      - name: Commit generated source and regression test
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/visual-catalogue-opencode.ts src/visual-catalogue-probe-fixture.ts test/visual-catalogue-probe-fixture.test.ts
          git commit -m "ODL-REQ-020: use a deterministic raster vision probe"
          git push origin HEAD:fix/odl-req-020-synthetic-vision-probe
