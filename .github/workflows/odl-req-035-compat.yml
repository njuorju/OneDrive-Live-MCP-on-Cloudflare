name: ODL-REQ-035 compatibility repair

on:
  push:
    branches:
      - fix/odl-req-035-luna-visual-fixture-recognition

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply compatibility patch and self-remove
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 --decode | gzip --decompress > /tmp/compat.patch
          echo '8b008b3ea42667ce73ad67e76ce6ca176f752311c2fdeb64d7940f06876932f6  /tmp/compat.patch' | sha256sum --check --strict
          git apply --check /tmp/compat.patch
          git apply /tmp/compat.patch
          git rm .github/workflows/odl-req-035-compat.yml
          git add src/visual-zen-responses-vision.ts test/visual-catalogue-zen-responses-odl035.test.ts
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: preserve vision validator compatibility'
          git push origin HEAD:fix/odl-req-035-luna-visual-fixture-recognition
