name: Deploy merged visual Phase 2 capabilities

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  actions: read

concurrency:
  group: visual-phase2-production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event.pull_request.head.ref == 'work/onedrivelive-visual-asset-phase2' && github.event.pull_request.base.ref == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TARGET_MERGE_SHA: 3643f6399304756a3e45d57e7b7dbeab3815d790
      CI_RUN_ID: "30165614614"
      BUNDLE_ARTIFACT: worker-bundle-f2bd7e503ea8947bc0b174ae06c44d90b549d29b
      EXPECTED_BUNDLE_SHA256: c5a7c9d2fe63e2467d39a0ef928be62ee94d8273fad31bcf454c2d7044f02bd7
      CLOUDFLARE_ACCOUNT_ID: 3f67b673280f2119de4eedd09745e20f
    steps:
      - name: Select established Cloudflare credential
        env:
          TOKEN_PRIMARY: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TOKEN_ALT: ${{ secrets.CF_API_TOKEN }}
          TOKEN_LEGACY: ${{ secrets.CLOUDFLARE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${TOKEN_PRIMARY:-}" ]]; then token="$TOKEN_PRIMARY"
          elif [[ -n "${TOKEN_ALT:-}" ]]; then token="$TOKEN_ALT"
          elif [[ -n "${TOKEN_LEGACY:-}" ]]; then token="$TOKEN_LEGACY"
          else echo "::error::No supported Cloudflare API token secret is configured."; exit 1
          fi
          echo "::add-mask::$token"
          printf 'CLOUDFLARE_API_TOKEN=%s\n' "$token" >> "$GITHUB_ENV"
      - name: Check out exact merged repository source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_MERGE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Re-run repository checks
        run: npm run check
      - name: Download exact successful CI bundle
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ env.CI_RUN_ID }}
          name: ${{ env.BUNDLE_ARTIFACT }}
          path: worker-bundle
      - name: Verify source and bundle identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_MERGE_SHA"
          echo "$EXPECTED_BUNDLE_SHA256  worker-bundle/index-closeout.js" | sha256sum --check --strict
          grep -q 'prepare_document_visual_asset' worker-bundle/index-closeout.js
          grep -q 'inspect_item_access' worker-bundle/index-closeout.js
          grep -q 'commit_visual_phase2_integrity_plan' worker-bundle/index-closeout.js
          grep -q 'commit_composed_prepared_integrity_plan' worker-bundle/index-closeout.js
      - name: Write bounded production rollout configuration
        shell: bash
        run: |
          cat > wrangler.phase2-rollout.jsonc <<'JSON'
          {
            "$schema": "node_modules/wrangler/config-schema.json",
            "name": "nikolay-onedrive-mcp",
            "main": "worker-bundle/index-closeout.js",
            "compatibility_date": "2026-07-23",
            "compatibility_flags": ["nodejs_compat"],
            "keep_vars": true,
            "migrations": [
              { "new_sqlite_classes": ["OneDriveMCP"], "tag": "v1" },
              { "new_sqlite_classes": ["AuthState"], "tag": "v2" },
              { "new_sqlite_classes": ["PaidCoordinator"], "tag": "v3" }
            ],
            "durable_objects": { "bindings": [
              { "class_name": "OneDriveMCP", "name": "MCP_OBJECT" },
              { "class_name": "AuthState", "name": "AUTH_STATE" },
              { "class_name": "PaidCoordinator", "name": "PAID_COORDINATOR" }
            ]},
            "kv_namespaces": [{ "binding": "OAUTH_KV", "id": "a3ead543dad24b8596ab9193b10f1b9f" }],
            "r2_buckets": [{ "binding": "ARTIFACTS", "bucket_name": "onedrive-live-mcp-artifacts" }],
            "queues": {
              "producers": [{ "binding": "PAID_JOBS", "queue": "onedrive-live-mcp-jobs" }],
              "consumers": [{
                "queue": "onedrive-live-mcp-jobs",
                "max_batch_size": 1,
                "max_batch_timeout": 5,
                "max_retries": 5,
                "dead_letter_queue": "onedrive-live-mcp-jobs-dlq",
                "max_concurrency": 3,
                "retry_delay": 10
              }]
            },
            "workflows": [{
              "name": "onedrive-live-mcp-durable-jobs",
              "binding": "PAID_WORKFLOW",
              "class_name": "PaidConnectorWorkflow",
              "limits": { "steps": 10000 }
            }],
            "ai": { "binding": "AI" },
            "images": { "binding": "IMAGES" },
            "browser": { "binding": "BROWSER" },
            "observability": {
              "enabled": true,
              "logs": { "enabled": true, "head_sampling_rate": 1, "invocation_logs": true },
              "traces": { "enabled": true, "head_sampling_rate": 0.1 }
            }
          }
          JSON
      - name: Dry-run exact production bundle
        run: npx wrangler deploy --config wrangler.phase2-rollout.jsonc --dry-run --outdir production-dry-run --keep-vars
      - name: Deploy exact validated bundle
        shell: bash
        run: |
          set -o pipefail
          npx wrangler deploy \
            --config wrangler.phase2-rollout.jsonc \
            --keep-vars \
            --message "Deploy ODL-REQ-011/012 visual Phase 2 from merge 3643f6399304756a3e45d57e7b7dbeab3815d790" \
            --tag "repo-3643f6399304756a3e45d57e7b7dbeab3815d790" \
            2>&1 | tee deployment-output.txt
      - name: Preserve non-secret deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2-production-deployment-evidence-${{ github.run_id }}
          path: |
            deployment-output.txt
            wrangler.phase2-rollout.jsonc
          if-no-files-found: warn
          retention-days: 1
