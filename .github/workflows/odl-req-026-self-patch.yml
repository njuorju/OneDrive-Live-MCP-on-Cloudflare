name: ODL-REQ-026 self patch

on:
  push:
    branches:
      - feature/odl-req-026-zen-model-discovery

permissions:
  contents: write

jobs:
  apply-repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/odl-req-026-zen-model-discovery
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply bounded Zen discovery repair
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          module = r'''import { ConnectorError } from "./errors";
import {
  ZEN_RESPONSES_CREDENTIAL_BINDING,
  ZEN_RESPONSES_MODE,
  ZEN_RESPONSES_MODEL,
  ZEN_RESPONSES_MODELS_ENDPOINT,
  ZEN_RESPONSES_PROVIDER,
  resolveZenResponsesPricing,
  type ZenResponsesModelMetadata,
} from "./visual-catalogue-zen-responses";

const MAX_MODELS_RESPONSE_BYTES = 128 * 1024;
const MODELS_FETCH_TIMEOUT_MS = 15_000;

export type ZenModelsDiscoveryReceipt = {
  version: 1;
  stage: "model_discovery";
  provider: typeof ZEN_RESPONSES_PROVIDER;
  mode: typeof ZEN_RESPONSES_MODE;
  model: typeof ZEN_RESPONSES_MODEL;
  endpointClass: "models_get";
  endpoint: typeof ZEN_RESPONSES_MODELS_ENDPOINT;
  dispatchBranch: "opencode_zen_responses_models_get";
  localErrorCode: string | null;
  localErrorClass: string | null;
  fetchBegan: boolean;
  credentialBindingExists: boolean;
  credentialBindingName: typeof ZEN_RESPONSES_CREDENTIAL_BINDING;
  correlationId: string;
  httpStatus: number | null;
  responseContentType: string | null;
  responseByteCount: number | null;
  responseEnvelopeShape: "openai_list" | "object" | "non_object" | null;
  topLevelObject: string | null;
  modelRecordCount: number | null;
  exactModelIdPresent: boolean | null;
  parserResult: string;
  billableRequestIncrement: 0;
  inputTokenIncrement: 0;
  outputTokenIncrement: 0;
  spendIncrementUsd: 0;
};

export class ZenModelsDiscoveryError extends ConnectorError {
  readonly receipt: ZenModelsDiscoveryReceipt;

  constructor(
    code: string,
    message: string,
    receipt: ZenModelsDiscoveryReceipt,
    options: { retryable?: boolean; status?: number } = {},
  ) {
    super(code, message, { ...options, correlationId: receipt.correlationId });
    this.receipt = receipt;
  }
}

export function isZenModelsDiscoveryError(error: unknown): error is ZenModelsDiscoveryError {
  if (!error || typeof error !== "object") return false;
  const value = error as Record<string, unknown>;
  const receipt = value.receipt;
  return typeof value.code === "string"
    && Boolean(receipt && typeof receipt === "object" && (receipt as Record<string, unknown>).stage === "model_discovery");
}

function baseReceipt(): ZenModelsDiscoveryReceipt {
  return {
    version: 1,
    stage: "model_discovery",
    provider: ZEN_RESPONSES_PROVIDER,
    mode: ZEN_RESPONSES_MODE,
    model: ZEN_RESPONSES_MODEL,
    endpointClass: "models_get",
    endpoint: ZEN_RESPONSES_MODELS_ENDPOINT,
    dispatchBranch: "opencode_zen_responses_models_get",
    localErrorCode: null,
    localErrorClass: null,
    fetchBegan: false,
    credentialBindingExists: false,
    credentialBindingName: ZEN_RESPONSES_CREDENTIAL_BINDING,
    correlationId: crypto.randomUUID(),
    httpStatus: null,
    responseContentType: null,
    responseByteCount: null,
    responseEnvelopeShape: null,
    topLevelObject: null,
    modelRecordCount: null,
    exactModelIdPresent: null,
    parserResult: "not_started",
    billableRequestIncrement: 0,
    inputTokenIncrement: 0,
    outputTokenIncrement: 0,
    spendIncrementUsd: 0,
  };
}

function failure(
  code: string,
  message: string,
  receipt: ZenModelsDiscoveryReceipt,
  localErrorClass: string,
  options: { retryable?: boolean; status?: number } = {},
): never {
  const failed = { ...receipt, localErrorCode: code, localErrorClass };
  throw new ZenModelsDiscoveryError(code, message, failed, options);
}

function stringArray(value: unknown): string[] {
  return Array.isArray(value) ? value.map(String).slice(0, 16) : [];
}

export async function discoverZenResponsesModelWithReceipt(
  env: Pick<Env, "OPENCODE_ZEN_API_KEY">,
  identity: { provider?: unknown; mode?: unknown; model?: unknown } = {},
  fetchImpl: typeof fetch = fetch,
): Promise<{ metadata: ZenResponsesModelMetadata; receipt: ZenModelsDiscoveryReceipt }> {
  let receipt = baseReceipt();
  const provider = String(identity.provider ?? ZEN_RESPONSES_PROVIDER);
  const mode = String(identity.mode ?? ZEN_RESPONSES_MODE);
  const model = String(identity.model ?? ZEN_RESPONSES_MODEL);
  if (provider !== ZEN_RESPONSES_PROVIDER || mode !== ZEN_RESPONSES_MODE || model !== ZEN_RESPONSES_MODEL) {
    failure(
      "zen_discovery_dispatch_unsupported",
      "Zen model discovery requires the exact opencode_zen_responses/opencode_responses/gpt-5.6-luna identity.",
      receipt,
      "dispatch_validation",
    );
  }

  const credential = typeof env.OPENCODE_ZEN_API_KEY === "string" ? env.OPENCODE_ZEN_API_KEY.trim() : "";
  receipt = { ...receipt, credentialBindingExists: credential.length > 0 };
  if (!credential) {
    failure(
      "zen_credential_binding_missing",
      "The OPENCODE_ZEN_API_KEY binding is not configured.",
      receipt,
      "credential_validation",
    );
  }

  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort("zen_models_timeout"), MODELS_FETCH_TIMEOUT_MS);
  let response: Response;
  receipt = { ...receipt, fetchBegan: true, parserResult: "fetch_started" };
  try {
    response = await fetchImpl(ZEN_RESPONSES_MODELS_ENDPOINT, {
      method: "GET",
      headers: { Authorization: `Bearer ${credential}` },
      redirect: "manual",
      signal: controller.signal,
    });
  } catch (error) {
    const errorClass = error instanceof Error ? error.name : typeof error;
    failure(
      "zen_models_fetch_failed",
      "The bounded Zen models GET did not produce an HTTP response.",
      receipt,
      errorClass,
      { retryable: true },
    );
  } finally {
    clearTimeout(timeout);
  }

  receipt = {
    ...receipt,
    httpStatus: response.status,
    responseContentType: response.headers.get("content-type")?.slice(0, 120) ?? null,
    parserResult: "http_response_received",
  };

  let bytes: Uint8Array;
  try {
    bytes = new Uint8Array(await response.arrayBuffer());
  } catch (error) {
    failure(
      "zen_models_fetch_failed",
      "The Zen models response body could not be read.",
      receipt,
      error instanceof Error ? error.name : typeof error,
      { retryable: true, status: response.status },
    );
  }
  receipt = { ...receipt, responseByteCount: bytes.byteLength };

  if (!response.ok) {
    failure(
      "zen_models_http_error",
      "The Zen models endpoint returned a non-success HTTP status.",
      receipt,
      "http_status",
      { retryable: response.status === 429 || response.status >= 500, status: response.status },
    );
  }
  if (bytes.byteLength > MAX_MODELS_RESPONSE_BYTES) {
    failure(
      "zen_models_response_malformed",
      "The Zen models response exceeded the bounded structural parsing limit.",
      receipt,
      "response_size",
      { status: response.status },
    );
  }

  let body: unknown;
  try {
    body = JSON.parse(new TextDecoder().decode(bytes));
  } catch {
    failure(
      "zen_models_response_malformed",
      "The Zen models response was not valid JSON.",
      { ...receipt, responseEnvelopeShape: "non_object", parserResult: "json_parse_failed" },
      "json_parse",
      { status: response.status },
    );
  }
  if (!body || typeof body !== "object" || Array.isArray(body)) {
    failure(
      "zen_models_response_malformed",
      "The Zen models response root was not an object.",
      { ...receipt, responseEnvelopeShape: "non_object", parserResult: "root_invalid" },
      "envelope_validation",
      { status: response.status },
    );
  }

  const root = body as Record<string, unknown>;
  const topLevelObject = root.object === undefined ? null : String(root.object);
  receipt = {
    ...receipt,
    responseEnvelopeShape: topLevelObject === "list" ? "openai_list" : "object",
    topLevelObject,
    parserResult: "json_object_parsed",
  };
  if (topLevelObject !== null && topLevelObject !== "list") {
    failure(
      "zen_models_response_malformed",
      "The Zen models response object discriminator was not list.",
      receipt,
      "envelope_validation",
      { status: response.status },
    );
  }
  if (!("data" in root)) {
    failure(
      "zen_models_data_missing",
      "The Zen models response did not contain data.",
      receipt,
      "data_validation",
      { status: response.status },
    );
  }
  if (!Array.isArray(root.data)) {
    failure(
      "zen_models_response_malformed",
      "The Zen models data member was not an array.",
      receipt,
      "data_validation",
      { status: response.status },
    );
  }

  const records = root.data;
  const exact = records.find((entry) => Boolean(
    entry && typeof entry === "object"
      && typeof (entry as Record<string, unknown>).id === "string"
      && (entry as Record<string, unknown>).id === ZEN_RESPONSES_MODEL,
  ));
  receipt = {
    ...receipt,
    responseEnvelopeShape: "openai_list",
    modelRecordCount: records.length,
    exactModelIdPresent: Boolean(exact),
    parserResult: "openai_list_parsed",
  };
  if (!exact) {
    failure(
      "zen_model_exact_id_absent",
      "The well-formed live Zen model list did not contain the exact gpt-5.6-luna ID.",
      receipt,
      "exact_id_validation",
      { status: response.status },
    );
  }

  const modelRecord = exact as Record<string, unknown>;
  return {
    metadata: {
      id: ZEN_RESPONSES_MODEL,
      enabled: true,
      inputModalities: stringArray(modelRecord.input_modalities ?? modelRecord.modalities),
      outputModalities: stringArray(modelRecord.output_modalities),
      pricingMetadataPresent: Boolean(modelRecord.pricing && typeof modelRecord.pricing === "object"),
      pricing: resolveZenResponsesPricing(modelRecord),
    },
    receipt,
  };
}
'''

          tests = r'''import test from "node:test";
import assert from "node:assert/strict";
import { readFile } from "node:fs/promises";
import {
  discoverZenResponsesModelWithReceipt,
  isZenModelsDiscoveryError,
} from "../src/visual-classifier-zen-model-discovery";
import {
  ZEN_RESPONSES_MODE,
  ZEN_RESPONSES_MODEL,
  ZEN_RESPONSES_MODELS_ENDPOINT,
  ZEN_RESPONSES_PROVIDER,
} from "../src/visual-catalogue-zen-responses";

const env = { OPENCODE_ZEN_API_KEY: "test-secret" } as any;

function mockJson(body: unknown, status = 200, observe?: (url: string, init?: RequestInit) => void): typeof fetch {
  return (async (input: RequestInfo | URL, init?: RequestInit) => {
    const url = input instanceof URL ? input.href : typeof input === "string" ? input : input.url;
    observe?.(url, init);
    return new Response(JSON.stringify(body), { status, headers: { "content-type": "application/json" } });
  }) as typeof fetch;
}

async function rejectedCode(promise: Promise<unknown>, code: string) {
  await assert.rejects(promise, (error: unknown) => {
    assert.equal(isZenModelsDiscoveryError(error), true);
    assert.equal((error as any).code, code);
    return true;
  });
}

test("exact Zen Responses discovery dispatches one bounded models GET and persists structural receipt", async () => {
  let calls = 0;
  let method = "";
  let url = "";
  const result = await discoverZenResponsesModelWithReceipt(env, {
    provider: ZEN_RESPONSES_PROVIDER, mode: ZEN_RESPONSES_MODE, model: ZEN_RESPONSES_MODEL,
  }, mockJson({ object: "list", data: [
    { id: "other", object: "model" },
    { id: ZEN_RESPONSES_MODEL, object: "model", owned_by: "opencode", extra: { tolerated: true } },
  ] }, 200, (seenUrl, init) => {
    calls += 1;
    url = seenUrl;
    method = String(init?.method);
  }));
  assert.equal(calls, 1);
  assert.equal(url, ZEN_RESPONSES_MODELS_ENDPOINT);
  assert.equal(method, "GET");
  assert.equal(result.metadata.id, ZEN_RESPONSES_MODEL);
  assert.equal(result.receipt.fetchBegan, true);
  assert.equal(result.receipt.httpStatus, 200);
  assert.equal(result.receipt.responseEnvelopeShape, "openai_list");
  assert.equal(result.receipt.modelRecordCount, 2);
  assert.equal(result.receipt.exactModelIdPresent, true);
  assert.equal(result.receipt.billableRequestIncrement, 0);
  assert.equal(result.receipt.inputTokenIncrement, 0);
  assert.equal(result.receipt.outputTokenIncrement, 0);
  assert.equal(result.receipt.spendIncrementUsd, 0);
  assert.equal(JSON.stringify(result.receipt).includes("test-secret"), false);
});

test("empty list and aliases never satisfy exact-ID discovery", async () => {
  await rejectedCode(discoverZenResponsesModelWithReceipt(env, {}, mockJson({ object: "list", data: [] })), "zen_model_exact_id_absent");
  await rejectedCode(discoverZenResponsesModelWithReceipt(env, {}, mockJson({ object: "list", data: [
    { id: "GPT-5.6-LUNA" }, { id: "gpt-5.6-luna-preview" }, { name: "gpt-5.6-luna" },
  ] })), "zen_model_exact_id_absent");
});

test("malformed root, missing data, and non-array data have precise classes", async () => {
  await rejectedCode(discoverZenResponsesModelWithReceipt(env, {}, mockJson([{}])), "zen_models_response_malformed");
  await rejectedCode(discoverZenResponsesModelWithReceipt(env, {}, mockJson({ object: "list" })), "zen_models_data_missing");
  await rejectedCode(discoverZenResponsesModelWithReceipt(env, {}, mockJson({ object: "list", data: {} })), "zen_models_response_malformed");
  await rejectedCode(discoverZenResponsesModelWithReceipt(env, {}, mockJson({ object: "collection", data: [] })), "zen_models_response_malformed");
});

test("non-2xx and network failures preserve whether fetch began", async () => {
  await assert.rejects(discoverZenResponsesModelWithReceipt(env, {}, mockJson({ error: "no" }, 503)), (error: unknown) => {
    assert.equal(isZenModelsDiscoveryError(error), true);
    assert.equal((error as any).code, "zen_models_http_error");
    assert.equal((error as any).receipt.fetchBegan, true);
    assert.equal((error as any).receipt.httpStatus, 503);
    return true;
  });
  const failing = (async () => { throw new TypeError("network down"); }) as typeof fetch;
  await assert.rejects(discoverZenResponsesModelWithReceipt(env, {}, failing), (error: unknown) => {
    assert.equal(isZenModelsDiscoveryError(error), true);
    assert.equal((error as any).code, "zen_models_fetch_failed");
    assert.equal((error as any).receipt.fetchBegan, true);
    assert.equal((error as any).receipt.httpStatus, null);
    return true;
  });
});

test("missing binding and local dispatch fail before fetch with no secret or provider body leakage", async () => {
  let calls = 0;
  const observing = (async () => { calls += 1; return new Response("{}"); }) as typeof fetch;
  await assert.rejects(discoverZenResponsesModelWithReceipt({ OPENCODE_ZEN_API_KEY: "" } as any, {}, observing), (error: unknown) => {
    assert.equal((error as any).code, "zen_credential_binding_missing");
    assert.equal((error as any).receipt.fetchBegan, false);
    assert.equal((error as any).receipt.credentialBindingExists, false);
    assert.equal("body" in (error as any).receipt, false);
    return true;
  });
  await assert.rejects(discoverZenResponsesModelWithReceipt(env, { provider: "opencode_go", mode: ZEN_RESPONSES_MODE, model: ZEN_RESPONSES_MODEL }, observing), (error: unknown) => {
    assert.equal((error as any).code, "zen_discovery_dispatch_unsupported");
    assert.equal((error as any).receipt.fetchBegan, false);
    return true;
  });
  assert.equal(calls, 0);
});

test("discovery repair is isolated from OpenCode Go, direct OpenAI, OneDrive, source, cache, and catalogue routes", async () => {
  const source = await readFile(new URL("../src/visual-classifier-zen-model-discovery.ts", import.meta.url), "utf8");
  assert.doesNotMatch(source, /OPENCODE_GO|OPENAI_API_KEY|api\.openai\.com|graphFetch|read_onedrive|render|catalogue|publish/);
  assert.match(source, /billableRequestIncrement: 0/);
  assert.match(source, /spendIncrementUsd: 0/);
});
'''

          Path("src/visual-classifier-zen-model-discovery.ts").write_text(module, encoding="utf-8")
          Path("test/visual-classifier-zen-model-discovery.test.ts").write_text(tests, encoding="utf-8")

          path = Path("src/visual-classifier-capability-zen-responses.ts")
