name: ODL-REQ-027 production verification

on:
  push:
    branches:
      - feature/odl-req-027-regional-attachments-zen-post

permissions:
  contents: write

concurrency:
  group: odl-req-027-production-verification
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 3f67b673280f2119de4eedd09745e20f
      WORKER_NAME: nikolay-onedrive-mcp
      SOURCE_SHA: 54f7466039d9f36ca3b08de0c4b72ed317a0276d
      BRANCH_NAME: feature/odl-req-027-regional-attachments-zen-post
      WORKFLOW_PATH: .github/workflows/odl-req-027-verify.yml
      TRIGGER_PATH: .odl-req-027-verify-trigger
      EVIDENCE_PATH: odl-req-027-production-evidence.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/odl-req-027-regional-attachments-zen-post
          fetch-depth: 0
      - name: Verify production read-only
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json")

          curl -fsS "${auth[@]}" "$api/workers/scripts/$WORKER_NAME/deployments" > deployments.json
          jq -e '.success == true and (.result.deployments[0].versions|length) == 1 and .result.deployments[0].versions[0].percentage == 100' deployments.json >/dev/null
          deployment_id=$(jq -r '.result.deployments[0].id' deployments.json)
          version_id=$(jq -r '.result.deployments[0].versions[0].version_id' deployments.json)

          curl -fsS "${auth[@]}" "$api/workers/scripts/$WORKER_NAME/versions?deployable=true" > versions.json
          version_number=$(jq -r --arg v "$version_id" '[.result.items[] | select(.id == $v)][0].number' versions.json)
          version_message=$(jq -r --arg v "$version_id" '[.result.items[] | select(.id == $v)][0].annotations["workers/message"]' versions.json)
          test "$version_number" = "99"
          test "$version_message" = "Deploy ODL-REQ-027 exact main $SOURCE_SHA"

          cat > expected-bindings.json <<'JSON'
          [
            {"name":"AI","type":"ai"},
            {"name":"ARTIFACTS","type":"r2_bucket"},
            {"name":"AUTH_STATE","type":"durable_object_namespace"},
            {"name":"BROWSER","type":"browser"},
            {"name":"CACHE_TTL_SECONDS","type":"plain_text"},
            {"name":"CONNECTOR_NAME","type":"plain_text"},
            {"name":"COOKIE_ENCRYPTION_KEY","type":"secret_text"},
            {"name":"IMAGES","type":"images"},
            {"name":"IMAGE_PROCESSING_TIMEOUT_MS","type":"plain_text"},
            {"name":"INTEGRITY_LEASE_SECONDS","type":"plain_text"},
            {"name":"MAX_FILE_MB","type":"plain_text"},
            {"name":"MAX_IMAGE_DIMENSION","type":"plain_text"},
            {"name":"MAX_IMAGE_INPUT_MB","type":"plain_text"},
            {"name":"MAX_IMAGE_PAGES","type":"plain_text"},
            {"name":"MAX_IMAGE_PIXELS","type":"plain_text"},
            {"name":"MAX_ORIGINAL_FILE_MB","type":"plain_text"},
            {"name":"MAX_READ_CHARS","type":"plain_text"},
            {"name":"MAX_TEXT_WRITE_KB","type":"plain_text"},
            {"name":"MCP_OBJECT","type":"durable_object_namespace"},
            {"name":"MICROSOFT_CLIENT_ID","type":"secret_text"},
            {"name":"MICROSOFT_CLIENT_SECRET","type":"secret_text"},
            {"name":"OAUTH_KV","type":"kv_namespace"},
            {"name":"ONEDRIVE_ROOT","type":"plain_text"},
            {"name":"OPENCODE_ZEN_API_KEY","type":"secret_text"},
            {"name":"OPENCODE_ZEN_DISCOVERY_TTL_SECONDS","type":"plain_text"},
            {"name":"OPENCODE_ZEN_MODEL","type":"plain_text"},
            {"name":"OWNER_MICROSOFT_ID","type":"plain_text"},
            {"name":"PAID_COORDINATOR","type":"durable_object_namespace"},
            {"name":"PAID_JOBS","type":"queue"},
            {"name":"PAID_MAX_SOURCE_MB","type":"plain_text"},
            {"name":"PAID_RENDER_ORIGIN","type":"plain_text"},
            {"name":"PAID_VISUAL_PARSE_MB","type":"plain_text"},
            {"name":"PAID_WORKFLOW","type":"workflow"},
            {"name":"SOURCE_INTEGRITY_PLAN_ID","type":"plain_text"},
            {"name":"VISUAL_CATALOGUE_WORKFLOW","type":"workflow"},
            {"name":"VISUAL_CLASSIFIER_CONCURRENCY","type":"plain_text"},
            {"name":"VISUAL_CLASSIFIER_JPEG_QUALITY","type":"plain_text"},
            {"name":"VISUAL_CLASSIFIER_MAX_DIMENSION","type":"plain_text"},
            {"name":"VISUAL_CLASSIFIER_MODEL","type":"plain_text"},
            {"name":"VISUAL_CLASSIFIER_PROVIDER","type":"plain_text"},
            {"name":"VISUAL_PROMPT_VERSION","type":"plain_text"},
            {"name":"VISUAL_RENDERER_VERSION","type":"plain_text"},
            {"name":"VISUAL_RUBRIC_VERSION","type":"plain_text"},
            {"name":"WORKER_DEPLOYMENT_ID","type":"plain_text"}
          ]
          JSON
          jq -S 'sort_by(.name)' expected-bindings.json > expected-bindings.sorted.json

          curl -fsS "${auth[@]}" "$api/workers/scripts/$WORKER_NAME/settings" > settings.json
          jq -S '[.result.bindings[] | {name,type}] | sort_by(.name)' settings.json > current-bindings.json
          cmp expected-bindings.sorted.json current-bindings.json

          cat > expected-secrets.json <<'JSON'
          [
            {"name":"COOKIE_ENCRYPTION_KEY","type":"secret_text"},
            {"name":"MICROSOFT_CLIENT_ID","type":"secret_text"},
            {"name":"MICROSOFT_CLIENT_SECRET","type":"secret_text"},
            {"name":"OPENCODE_ZEN_API_KEY","type":"secret_text"}
          ]
          JSON
          jq -S 'sort_by(.name)' expected-secrets.json > expected-secrets.sorted.json
          curl -fsS "${auth[@]}" "$api/workers/scripts/$WORKER_NAME/secrets" > secrets.json
          jq -S '[.result[] | {name,type}] | sort_by(.name)' secrets.json > current-secrets.json
          cmp expected-secrets.sorted.json current-secrets.json
          jq -e 'any(.[]; .name == "OPENCODE_ZEN_API_KEY" and .type == "secret_text")' current-secrets.json >/dev/null

          health_status=$(curl -sS --retry 8 --retry-all-errors --retry-delay 2 -o health.json -w '%{http_code}' "https://nikolay-onedrive-mcp.fdas201290.workers.dev/health")
          test "$health_status" = "200"
          jq -e '.ok == true' health.json >/dev/null

          jq -n \
            --arg sourceCommit "$SOURCE_SHA" \
            --arg deploymentId "$deployment_id" \
            --arg versionId "$version_id" \
            --argjson versionNumber "$version_number" \
            --argjson bindingCount "$(jq 'length' current-bindings.json)" \
            --argjson secretBindingCount "$(jq 'length' current-secrets.json)" \
            '{sourceCommit:$sourceCommit,deploymentId:$deploymentId,versionId:$versionId,versionNumber:$versionNumber,trafficPercent:100,healthHttpStatus:200,healthOk:true,bindingCount:$bindingCount,bindingsUnchanged:true,secretBindingCount:$secretBindingCount,secretBindingsUnchanged:true,opencodeZenSecretPresent:true,oneDriveAccessed:false,oneDriveMutationPerformed:false,academicOperationPerformed:false,legalOperationPerformed:false,visualOperationPerformed:false,liveAttachmentValidationPerformed:false,providerRequestPerformed:false,capabilityJobStarted:false,visualCalibrationStarted:false,operationalSurfaceRefreshed:false}' > "$EVIDENCE_PATH"
          cat "$EVIDENCE_PATH"
      - name: Commit sanitized evidence and remove verification trigger
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm "$WORKFLOW_PATH" "$TRIGGER_PATH"
          git add "$EVIDENCE_PATH"
          git commit -m "ops: record ODL-REQ-027 production verification"
          git push origin "HEAD:$BRANCH_NAME"
