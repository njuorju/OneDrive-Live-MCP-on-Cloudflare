name: Visual Phase 2 CI type fix

on:
  push:
    branches:
      - work/onedrivelive-visual-asset-phase2

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[phase2-ci-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/onedrivelive-visual-asset-phase2
          fetch-depth: 0
      - name: Narrow evidence records
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/visual-phase2.ts')
          text = path.read_text()
          old = 'provenance: raw.provenance ?? {}, rightsEvidence: raw.rightsEvidence ?? {}'
          new = 'provenance: raw.provenance && typeof raw.provenance === "object" ? raw.provenance as Record<string, unknown> : {}, rightsEvidence: raw.rightsEvidence && typeof raw.rightsEvidence === "object" ? raw.rightsEvidence as Record<string, unknown> : {}'
          if old not in text:
              raise SystemExit('expected evidence fragment absent')
          path.write_text(text.replace(old, new))
          PY
      - name: Commit correction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/visual-phase2.ts
          git diff --cached --quiet && exit 0
          git commit -m "Fix visual Phase 2 evidence typing [phase2-ci-fix]"
          git push origin HEAD:work/onedrivelive-visual-asset-phase2
