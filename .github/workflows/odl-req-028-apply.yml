test("Cloudflare-style detached fetch TypeError is reproduced, classified, sanitized, and repaired by binding global fetch", async () => {
  const exactRuntimeMessage = "Illegal invocation: function called with incorrect `this` reference. See https://developers.cloudflare.com/workers/observability/errors/#illegal-invocation-errors for details.";
  const failed = await setup("transport-illegal-invocation");
  await assert.rejects(
    () => requestZenResponses({
      env: failed.env,
      spendLedgerKey: failed.ledger.key,
      body: buildZenResponsesRequest({ text: "NO_LEAK_PROMPT", maxOutputTokens: 64 }),
      context: "test",
      fetchImpl: (async () => { throw new TypeError(exactRuntimeMessage); }) as typeof fetch,
    }),
    (error: unknown) => {
      if (!isZenResponsesTransportError(error)) return false;
      assert.equal(error.code, "zen_responses_fetch_illegal_invocation");
      assert.equal(error.receipt.localErrorClass, "runtime_fetch_binding");
      assert.equal(error.receipt.errorName, "TypeError");
      assert.equal(error.receipt.errorMessage, "Illegal invocation: function called with incorrect this reference. See [documentation URL removed] for details.");
      assert.equal(error.receipt.codeLocation, "visual-catalogue-zen-responses.requestZenResponses.fetch");
      assert.equal(error.receipt.requestMethod, "POST");
      assert.deepEqual(error.receipt.headerNames, ["authorization", "content-type"]);
      assert.equal(error.receipt.signalPresent, true);
      assert.equal(error.receipt.redirectMode, "error");
      assert.equal(error.receipt.fetchImplementationClass, "explicit_injected");
      const rendered = JSON.stringify(error.receipt);
      for (const forbidden of ["NO_LEAK_PROMPT", "zen-secret", "https://", "Bearer ", exactRuntimeMessage]) assert.equal(rendered.includes(forbidden), false, forbidden);
      return true;
    },
  );

  const originalFetch = globalThis.fetch;
  const observedInits: RequestInit[] = [];
  const observedBodies: Record<string, unknown>[] = [];
  const runtimeFetch = async function(this: unknown, input: RequestInfo | URL, init?: RequestInit): Promise<Response> {
    if (this !== globalThis) throw new TypeError(exactRuntimeMessage);
    assert.equal(input, ZEN_RESPONSES_ENDPOINT);
    assert.ok(init);
    observedInits.push(init);
    observedBodies.push(JSON.parse(String(init.body)) as Record<string, unknown>);
    return new Response(JSON.stringify(completed('{"ok":true,"probe":"odl-req-025"}')), { status: 200, headers: { "content-type": "application/json" } });
  } as typeof fetch;
  Object.defineProperty(globalThis, "fetch", { configurable: true, writable: true, value: runtimeFetch });
  try {
    const detached = globalThis.fetch;
    await assert.rejects(() => detached("https://example.invalid"), (error: unknown) => error instanceof TypeError && error.message === exactRuntimeMessage);

    const repaired = await setup("transport-bound-global");
    const body = buildZenResponsesRequest({ text: "x", maxOutputTokens: 64, schema: { name: "probe", schema: { type: "object" } } });
    const result = await requestZenResponses({ env: repaired.env, spendLedgerKey: repaired.ledger.key, body, context: "test" });
    assert.equal(result.status, 200);
    assert.equal(result.transportReceipt.fetchImplementationClass, "global_fetch_bound");
    assert.equal(observedInits.length, 1);
    const init = observedInits[0];
    assert.equal(Object.getPrototypeOf(init), Object.prototype);
    assert.equal(Object.getPrototypeOf(init.headers as object), Object.prototype);
    assert.equal(init.method, "POST");
    assert.equal(init.redirect, "error");
    assert.equal(typeof init.body, "string");
    assert.ok(init.signal instanceof AbortSignal);
    assert.equal(init.signal?.aborted, false);
    assert.equal("duplex" in init, false);
    assert.equal("keepalive" in init, false);
    for (const value of Object.values(init.headers as Record<string, unknown>)) assert.equal(typeof value, "string");
    assert.deepEqual(observedBodies[0], body);
    const persisted = transportObjects(repaired.r2).map((entry) => entry.receipt);
    assert.ok(persisted.every((entry) => entry.signal === undefined && entry.requestInit === undefined && entry.body === undefined && entry.headers === undefined && entry.endpoint === undefined));
  } finally {
    Object.defineProperty(globalThis, "fetch", { configurable: true, writable: true, value: originalFetch });
  }
});

test("each Zen Responses attempt receives a fresh signal and explicit null fetch fails closed before global fetch", async () => {
  const signals: AbortSignal[] = [];
  const injected = (async (_input: RequestInfo | URL, init?: RequestInit) => {
    assert.ok(init?.signal instanceof AbortSignal);
    signals.push(init.signal);
    return new Response(JSON.stringify(completed("ok")), { status: 200, headers: { "content-type": "application/json" } });
  }) as typeof fetch;
  const fresh = await setup("transport-fresh-signals");
  for (let index = 0; index < 2; index += 1) {
    await requestZenResponses({ env: fresh.env, spendLedgerKey: fresh.ledger.key, body: buildZenResponsesRequest({ text: "x", maxOutputTokens: 64 }), context: `test:${index}`, fetchImpl: injected });
  }
  assert.equal(signals.length, 2);
  assert.notEqual(signals[0], signals[1]);

  const originalFetch = globalThis.fetch;
  let globalCalls = 0;
  Object.defineProperty(globalThis, "fetch", { configurable: true, writable: true, value: (async () => { globalCalls += 1; return new Response("{}"); }) as typeof fetch });
  try {
    const closed = await setup("transport-null-fetch");
    await assert.rejects(
      () => requestZenResponses({ env: closed.env, spendLedgerKey: closed.ledger.key, body: buildZenResponsesRequest({ text: "x", maxOutputTokens: 64 }), context: "test", fetchImpl: null as any }),
      (error: unknown) => isZenResponsesTransportError(error) && error.code === "zen_responses_fetch_not_started" && error.receipt.fetchImplementationClass === "invalid_explicit",
    );
    assert.equal(globalCalls, 0);
  } finally {
    Object.defineProperty(globalThis, "fetch", { configurable: true, writable: true, value: originalFetch });
  }
});

test("redirect rejection, 64 KiB ceiling, payload identity, discovery isolation, attachment host, and existing providers remain unchanged", async () => {
  const redirected = await setup("transport-redirect");
  const body = buildZenResponsesRequest({ text: "x", maxOutputTokens: 64 });
  await assert.rejects(
    () => requestZenResponses({
      env: redirected.env,
      spendLedgerKey: redirected.ledger.key,
      body,
      context: "test",
      fetchImpl: (async (_input: RequestInfo | URL, init?: RequestInit) => {
        assert.equal(init?.redirect, "error");
        assert.deepEqual(JSON.parse(String(init?.body)), body);
        return new Response(JSON.stringify({ error: { type: "redirect" } }), { status: 302, headers: { "content-type": "application/json", location: "https://example.invalid" } });
      }) as typeof fetch,
    }),
    (error: unknown) => isZenResponsesTransportError(error) && error.code === "zen_responses_http_error" && error.receipt.httpStatus === 302,
  );
  const transport = await readFile(new URL("../src/visual-catalogue-zen-responses.ts", import.meta.url), "utf8");
  assert.match(transport, /MAX_RESPONSE_BYTES = 64 \* 1024/);
  assert.match(transport, /globalThis\.fetch\.bind\(globalThis\)/);
  assert.doesNotMatch(transport, /duplex:|keepalive:/);
  const discovery = await readFile(new URL("../src/visual-classifier-zen-model-discovery.ts", import.meta.url), "utf8");
  assert.match(discovery, /ZEN_RESPONSES_MODELS_ENDPOINT/);
  assert.doesNotMatch(discovery, /requestZenResponses|responses_post/);
  const attachments = await readFile(new URL("../src/connector-files.ts", import.meta.url), "utf8");
  assert.match(attachments, /oaisdmntpr\[a-z0-9\]\+/);
  assert.doesNotMatch(transport, /OPENCODE_GO|mimo-v2\.5|OPENAI_API_KEY|api\.openai\.com/);
});
