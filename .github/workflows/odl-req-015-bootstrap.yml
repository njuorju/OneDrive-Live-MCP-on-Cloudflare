name: Implement ODL-REQ-015 permission provenance

on:
  push:
    branches:
      - work/odl-req-015-permission-provenance

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/odl-req-015-permission-provenance
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply bounded observability implementation
        run: |
          base64 --decode scripts/.odl-req-015-patch.py.gz.b64 | gzip --decompress > /tmp/odl-req-015-patch.py
          python /tmp/odl-req-015-patch.py
      - name: Install and verify
        run: npm ci && npm run check
      - name: Commit bounded implementation
        run: |
          rm scripts/.odl-req-015-patch.py.gz.b64 .github/workflows/odl-req-015-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/visual-phase2.ts test/permission-provenance.test.ts scripts/.odl-req-015-patch.py.gz.b64 .github/workflows/odl-req-015-bootstrap.yml
          git commit -m "Expose permission provenance and enforcement preview [ODL-REQ-015]"
          git push origin HEAD:work/odl-req-015-permission-provenance
