name: ODL-REQ-035 bounded bootstrap

on:
  push:
    branches:
      - fix/odl-req-035-luna-visual-fixture-recognition

permissions:
  contents: write

jobs:
  apply-bounded-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply exact bounded patch and remove bootstrap
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 --decode | gzip --decompress > /tmp/odl-req-035.patch
          echo 'd004b6851b7047253cd4c2289d9115d0c0bd962cb60ee23b942d7d8714878f79  /tmp/odl-req-035.patch' | sha256sum --check --strict
          git apply --check /tmp/odl-req-035.patch
          git apply /tmp/odl-req-035.patch
          git rm .github/workflows/odl-req-035-bootstrap.yml
          git add src/visual-classifier-capability-zen-responses.ts src/visual-zen-responses-vision.ts test/visual-catalogue-zen-responses-odl035.test.ts
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: harden Luna visual fixture recognition'
          git push origin HEAD:fix/odl-req-035-luna-visual-fixture-recognition
