name: Deploy ODL-REQ-021 bridge exact main

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: deploy-nikolay-onedrive-mcp
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 3f67b673280f2119de4eedd09745e20f
      WORKER_NAME: nikolay-onedrive-mcp
      EXACT_MAIN_SHA: e91b9b3a37e6051bc1171bbdf366eb66466d933e
      OPENING_VERSION_ID: a55b1f1f-7573-4244-885c-932ee8053675
      OPENING_DEPLOYMENT_ID: e225e3d5-31c0-4a07-97ea-c07de8f8f1ce
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e91b9b3a37e6051bc1171bbdf366eb66466d933e
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm

      - run: npm ci --ignore-scripts --no-audit --no-fund
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org/

      - name: Verify exact merged source and repository gates
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXACT_MAIN_SHA"
          npm run type-check
          npm test
          npm audit --omit=dev --audit-level=high

      - name: Generate production config from verified bindings
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          cfg = json.loads(Path('wrangler.jsonc').read_text())
          sha = os.environ['EXACT_MAIN_SHA']
          cfg['name'] = os.environ['WORKER_NAME']
          cfg['keep_vars'] = True
          cfg['kv_namespaces'] = [
            {'binding': 'OAUTH_KV', 'id': 'a3ead543dad24b8596ab9193b10f1b9f'}
          ]
          cfg['vars'].update({
            'CONNECTOR_NAME': 'OneDrive Live MCP',
            'ONEDRIVE_ROOT': 'Работа',
            'MAX_FILE_MB': '20',
            'MAX_ORIGINAL_FILE_MB': '25',
            'MAX_TEXT_WRITE_KB': '4096',
            'MAX_READ_CHARS': '50000',
            'CACHE_TTL_SECONDS': '604800',
            'MAX_IMAGE_INPUT_MB': '15',
            'MAX_IMAGE_PIXELS': '40000000',
            'MAX_IMAGE_DIMENSION': '8192',
            'MAX_IMAGE_PAGES': '8',
            'IMAGE_PROCESSING_TIMEOUT_MS': '15000',
            'INTEGRITY_LEASE_SECONDS': '600',
            'PAID_MAX_SOURCE_MB': '500',
            'PAID_VISUAL_PARSE_MB': '40',
            'PAID_RENDER_ORIGIN': 'https://nikolay-onedrive-mcp.fdas201290.workers.dev',
            'VISUAL_CLASSIFIER_PROVIDER': 'openai',
            'VISUAL_CLASSIFIER_MODEL': 'gpt-5.2-2025-12-11',
            'OPENCODE_ZEN_MODEL': 'mimo-v2.5-free',
            'OPENCODE_ZEN_DISCOVERY_TTL_SECONDS': '3600',
            'VISUAL_CLASSIFIER_CONCURRENCY': '2',
            'VISUAL_CLASSIFIER_MAX_DIMENSION': '1280',
            'VISUAL_CLASSIFIER_JPEG_QUALITY': '82',
            'VISUAL_RUBRIC_VERSION': 'uca-visual-rubric-2026-08-02',
            'VISUAL_PROMPT_VERSION': 'visual-source-classifier-opencode-mimo-2026-08-02',
            'VISUAL_RENDERER_VERSION': 'pdfjs-cache-v1',
            'WORKER_DEPLOYMENT_ID': f'repo-{sha}'
          })
          Path('wrangler.production.json').write_text(json.dumps(cfg, ensure_ascii=False, indent=2) + '\n')
          PY

      - name: Verify opening production lease and binding surface
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json")

          curl -fsS "${auth[@]}" "$api/workers/scripts/$WORKER_NAME/deployments" > pre-deployments.json
          jq -e --arg deployment "$OPENING_DEPLOYMENT_ID" --arg version "$OPENING_VERSION_ID" '
            .success == true and
            .result.deployments[0].id == $deployment and
            .result.deployments[0].versions == [{version_id: $version, percentage: 100}]
          ' pre-deployments.json >/dev/null

          curl -fsS "${auth[@]}" "$api/workers/scripts/$WORKER_NAME/settings" > pre-settings.json
          jq -S '[.result.bindings[] | {name, type}] | sort_by(.name)' pre-settings.json > pre-bindings.json
          jq -e 'any(.[]; .name == "VISUAL_CATALOGUE_WORKFLOW" and .type == "workflow")' pre-bindings.json >/dev/null
          jq -e 'any(.[]; .name == "PAID_JOBS" and .type == "queue")' pre-bindings.json >/dev/null

          curl -fsS "${auth[@]}" "$api/workers/scripts/$WORKER_NAME/secrets" > pre-secrets.json
          jq -S '[.result[] | {name, type}] | sort_by(.name)' pre-secrets.json > pre-secret-bindings.json
          jq -e 'any(.[]; .name == "OPENCODE_ZEN_API_KEY" and .type == "secret_text")' pre-secret-bindings.json >/dev/null

      - name: Upload and deploy exact merged Worker
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy \
            --config wrangler.production.json \
            --name "$WORKER_NAME" \
            --message "Deploy ODL-REQ-021 bridge exact main $EXACT_MAIN_SHA" \
            --tag "odl-req-021-bridge-${EXACT_MAIN_SHA:0:12}" \
            2>&1 | tee deployment.log

      - name: Verify deployment, traffic, bindings, secret, and health
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json")

          curl -fsS "${auth[@]}" "$api/workers/scripts/$WORKER_NAME/deployments" > post-deployments.json
          jq -e --arg opening "$OPENING_DEPLOYMENT_ID" '
            .success == true and
            .result.deployments[0].id != $opening and
            (.result.deployments[0].versions | length) == 1 and
            .result.deployments[0].versions[0].percentage == 100
          ' post-deployments.json >/dev/null
          deployment_id=$(jq -r '.result.deployments[0].id' post-deployments.json)
          version_id=$(jq -r '.result.deployments[0].versions[0].version_id' post-deployments.json)

          curl -fsS "${auth[@]}" "$api/workers/scripts/$WORKER_NAME/versions?deployable=true" > post-versions.json
          version_number=$(jq -r --arg version "$version_id" '[.result.items[] | select(.id == $version)][0].number' post-versions.json)
          test "$version_number" != "null"

          curl -fsS "${auth[@]}" "$api/workers/scripts/$WORKER_NAME/settings" > post-settings.json
          jq -S '[.result.bindings[] | {name, type}] | sort_by(.name)' post-settings.json > post-bindings.json
          cmp pre-bindings.json post-bindings.json

          curl -fsS "${auth[@]}" "$api/workers/scripts/$WORKER_NAME/secrets" > post-secrets.json
          jq -S '[.result[] | {name, type}] | sort_by(.name)' post-secrets.json > post-secret-bindings.json
          cmp pre-secret-bindings.json post-secret-bindings.json
          jq -e 'any(.[]; .name == "OPENCODE_ZEN_API_KEY" and .type == "secret_text")' post-secret-bindings.json >/dev/null

          health=$(curl -fsS --retry 8 --retry-all-errors --retry-delay 2 "https://nikolay-onedrive-mcp.fdas201290.workers.dev/health")
          jq -e '.ok == true' <<<"$health" >/dev/null

          jq -n \
            --arg sourceCommit "$EXACT_MAIN_SHA" \
            --arg deploymentId "$deployment_id" \
            --arg versionId "$version_id" \
            --argjson versionNumber "$version_number" \
            '{sourceCommit:$sourceCommit,deploymentId:$deploymentId,versionId:$versionId,versionNumber:$versionNumber,trafficPercent:100,bindingsUnchanged:true,secretBindingsUnchanged:true,opencodeSecretPresent:true,healthHttp200:true}' \
            > deployment-evidence.json
          cat deployment-evidence.json

      - name: Upload sanitized deployment evidence
        uses: actions/upload-artifact@v4
        with:
          name: odl-req-021-bridge-deployment-evidence
          path: |
            deployment.log
            deployment-evidence.json
            pre-bindings.json
            post-bindings.json
            pre-secret-bindings.json
            post-secret-bindings.json
          if-no-files-found: error
          retention-days: 7
