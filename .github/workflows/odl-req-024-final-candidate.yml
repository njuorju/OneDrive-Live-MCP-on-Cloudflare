name: ODL-REQ-024 final candidate validation

on:
  push:
    branches:
      - odl-req-024-opencode-go-vision-contract
    paths:
      - .odl-req-024-final-candidate

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 5b50042576b528a591c657589a4a1f7bdd2b0e5f
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
      - run: npm run type-check
      - run: npm test
      - run: npm audit --audit-level=high --omit=dev
      - name: Dry-run Worker bundle
        run: |
          cp wrangler.jsonc wrangler.ci.jsonc
          sed -i 's/REPLACE_WITH_ALLOWED_ONEDRIVE_FOLDER/CI_TEST_ROOT/g' wrangler.ci.jsonc
          sed -i 's/REPLACE_WITH_KV_NAMESPACE_ID/00000000000000000000000000000000/g' wrangler.ci.jsonc
          npx wrangler deploy --dry-run --config wrangler.ci.jsonc --outdir dist
      - name: Record exact result
        run: |
          test "$(git rev-parse HEAD)" = "5b50042576b528a591c657589a4a1f7bdd2b0e5f"
          printf '%s\n' '{"validatedCommit":"5b50042576b528a591c657589a4a1f7bdd2b0e5f","typeCheck":true,"fullTests":true,"securityGate":true,"dryRunBundle":true}' > result.json
      - uses: actions/upload-artifact@v4
        with:
          name: odl-req-024-final-candidate-validation
          path: result.json
          retention-days: 1
      - run: exit 1
