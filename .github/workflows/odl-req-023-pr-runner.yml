name: ODL-REQ-023 PR runner

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'odl-req-023-chatgpt-file-params'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: odl-req-023-chatgpt-file-params
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"
          cache: npm
      - name: Execute focused implementation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          src = Path('.github/workflows/odl-req-023-apply.yml').read_text().splitlines()
          marker = '        run: |'
          index = src.index(marker) + 1
          body = []
          for line in src[index:]:
              body.append(line[10:] if line.startswith('          ') else line)
          npm_index = next(i for i, line in enumerate(body) if line.startswith('npm ci '))
          fix = [
              "python - <<'PYFIX'",
              "from pathlib import Path",
              "p = Path('src/file-backed-text.ts')",
              "s = p.read_text()",
              "marker = 'export type CatalogueParityResult = {'",
              "types = '''type CatalogueRecord = Record<string, unknown>;\ntype ParsedCsv = { records: CatalogueRecord[]; columns: string[] };\ntype FileBackedContext = { env: Env; userId: string };\ntype ExactVerification = {\n  item: VerifiedItem;\n  bytes: Uint8Array;\n  byteLength: number;\n  sha256: string;\n  verified: true;\n};\n\n'''",
              "if 'type CatalogueRecord = Record<string, unknown>;' not in s:",
              "    s = s.replace(marker, types + marker, 1)",
              "p.write_text(s)",
              "q = Path('test/file-backed-text.test.ts')",
              "x = q.read_text()",
              "x = x.replace('const connectorReference = { download_url: \\\"https://files.openaiusercontent.com/connector/fixture\\\", file_id: \\\"file_fixture\\\", mime_type: \\\"text/plain\\\", file_name: \\\"fixture.txt\\\" };', 'const connectorReference = { download_url: \\\"https://files.openaiusercontent.com/connector/fixture\\\", file_id: \\\"file_fixture\\\" };')",
              "x = x.replace('error.code === \\\"unsupported_text_extension\\\"', 'error.code === \\\"connector_file_content_invalid\\\"')",
              "q.write_text(x)",
              "n = Path('test/connector-file-contract.test.ts')",
              "v = n.read_text()",
              "v = v.replace('source_record_id,name\\\\n\\\"ACA-0001,A\\\\n', 'source_record_id,name\\\\n\\\"ACA-0001,A')",
              "v = v.replace('e.code === \\\"invalid_json_catalogue\\\"', 'e.code === \\\"malformed_catalogue\\\"')",
              "n.write_text(v)",
              "r = Path('test/production-rollout.test.ts')",
              "y = r.read_text()",
              "y = y.replace('ODL-REQ-022', 'ODL-REQ-023')",
              "y = y.replace('8b0ca778-3581-4d25-bba9-9e0989c0848d', '8b57490f-6720-4323-8542-5ba7716dafe0')",
              "y = y.replace('6ff73d96-9742-49d2-b82e-f062eaa2bd28', '0ba7d0c4-e694-4681-8e5a-f90917e0a43b')",
              "y = y.replace('odl-req-022', 'odl-req-023')",
              "r.write_text(y)",
              "PYFIX",
          ]
          body[npm_index:npm_index] = fix
          body.insert(-4, 'rm -f .github/workflows/odl-req-023-pr-runner.yml .odl-req-023-trigger')
          Path('/tmp/odl23-apply.sh').write_text('\n'.join(body) + '\n')
          PY
          bash /tmp/odl23-apply.sh
