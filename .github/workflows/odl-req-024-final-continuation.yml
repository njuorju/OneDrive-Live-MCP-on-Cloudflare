name: ODL-REQ-024 final Probe D validation

on:
  push:
    branches:
      - odl-req-024-opencode-go-vision-contract
    paths:
      - .odl-req-024-final-continuation

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ca5681e6f47dfa9e0ecfbecfed2125d8f53874ea
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
      - run: npm run type-check
      - run: npm test
      - run: npm audit --audit-level=high --omit=dev
      - name: Dry-run Worker bundle
        run: |
          cp wrangler.jsonc wrangler.ci.jsonc
          sed -i 's/REPLACE_WITH_ALLOWED_ONEDRIVE_FOLDER/CI_TEST_ROOT/g' wrangler.ci.jsonc
          sed -i 's/REPLACE_WITH_KV_NAMESPACE_ID/00000000000000000000000000000000/g' wrangler.ci.jsonc
          npx wrangler deploy --dry-run --config wrangler.ci.jsonc --outdir dist
      - name: Record exact validation
        run: |
          test "$(git rev-parse HEAD)" = "ca5681e6f47dfa9e0ecfbecfed2125d8f53874ea"
          printf '%s\n' '{"validatedCommit":"ca5681e6f47dfa9e0ecfbecfed2125d8f53874ea","typeCheck":true,"fullTests":true,"securityGate":true,"dryRunBundle":true}' > validation.json
      - uses: actions/upload-artifact@v4
        with:
          name: odl-req-024-final-probe-d-validation
          path: validation.json
          retention-days: 1
      - run: exit 1
