name: ODL-REQ-022 PR materializer

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  materialize:
    if: github.head_ref == 'work/odl-req-022-opencode-go-mimo-paid'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1
      - name: Materialize the reviewed patch and remove bootstrap files
        shell: bash
        run: |
          set -euo pipefail
          cat .odl-req-022-patch/chunk-* > /tmp/patch.b64
          base64 -d /tmp/patch.b64 > /tmp/patch.tgz
          tar -xzf /tmp/patch.tgz
          rm -rf .odl-req-022-patch
          rm -f .github/workflows/odl-req-022-bootstrap.yml
          rm -f .github/workflows/odl-req-022-materialize-pr.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Implement ODL-REQ-022 OpenCode Go paid route'
          git push origin HEAD:${{ github.head_ref }}
