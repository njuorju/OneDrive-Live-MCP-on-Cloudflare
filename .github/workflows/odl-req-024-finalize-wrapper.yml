name: ODL-REQ-024 finalize Workflow wrapper

on:
  push:
    branches:
      - odl-req-024-opencode-go-vision-contract
    paths:
      - .odl-req-024-finalize-wrapper

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: odl-req-024-opencode-go-vision-contract
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"
          cache: npm
      - name: Align exact v94 opening lease
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          replacements = {
            'e06f333e-3343-433f-b876-4968e32d2f18': 'da5558f0-fe88-455c-a4e1-803e2dd279d3',
            '987e6b2d-1ad0-453f-a0de-6f17513e2223': 'c2ce8604-3751-4c24-bfb8-76b80c0f81f6',
          }
          for name in ['.github/workflows/ci.yml', 'test/production-rollout.test.ts']:
            path = Path(name)
            text = path.read_text()
            for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                raise SystemExit(f'{name}: expected one {old}, found {count}')
              text = text.replace(old, new)
            path.write_text(text)
          PY
      - name: Install and validate
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run type-check
          npm test
          npm audit --audit-level=high --omit=dev
          cp wrangler.jsonc wrangler.ci.jsonc
          sed -i 's/REPLACE_WITH_ALLOWED_ONEDRIVE_FOLDER/CI_TEST_ROOT/g' wrangler.ci.jsonc
          sed -i 's/REPLACE_WITH_KV_NAMESPACE_ID/00000000000000000000000000000000/g' wrangler.ci.jsonc
          npx wrangler deploy --dry-run --config wrangler.ci.jsonc --outdir dist
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
      - name: Commit exact validated recovery
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/ci.yml test/production-rollout.test.ts
          git commit -m "Lease ODL-REQ-024 recovery to Worker v94"
          git push origin HEAD:odl-req-024-opencode-go-vision-contract
